<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨유에탑 ✦ 영어단어장 - 수능보카 final 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --success: #10B981;
  --danger: #EF4444;
  --warn: #F59E0B;
  --gray: #6B7280;
  --border: #E5E7EB;
  --bg: #F9FAFB;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background-color: #111827; display: flex; justify-content: center; min-height: 100vh; }
.app-container { width: 100%; max-width: 420px; background-color: var(--bg); min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
.en { font-family: 'Nunito', sans-serif; }

/* Header */
.header { background: #fff; padding: 16px; border-bottom: 1px solid var(--border); text-align: center; }
.header-brand { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
.header-sub { font-size: 12px; color: var(--gray); margin-top: 4px; font-weight: 500; }

/* Navigation Tabs */
.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.tab-btn { flex: 1; padding: 12px 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--gray); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Main Content Area */
.content { flex: 1; padding: 16px; overflow-y: auto; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Range Scroll Bar */
.range-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
.range-bar::-webkit-scrollbar { display: none; }
.range-btn { padding: 6px 12px; font-size: 12px; font-weight: 700; border-radius: 20px; border: 1px solid var(--border); background: #fff; color: var(--gray); white-space: nowrap; cursor: pointer; }
.range-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* List Tab UI */
.search-box { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; margin-bottom: 10px; background: #fff; }
.filter-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.filter-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); background: #fff; color: var(--gray); border-radius: 8px; cursor: pointer; }
.filter-btn.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

.word-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; transition: opacity 0.2s; }
.word-card.known { opacity: 0.35; }
.chk-btn { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: #fff; flex-shrink: 0; }
.word-card.known .chk-btn { background: var(--success); border-color: var(--success); }
.word-info { flex: 1; min-width: 0; }
.word-title { font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 2px; word-break: break-all; }
.word-meaning { font-size: 13px; color: var(--gray); font-weight: 500; }
.ibtn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; flex-shrink: 0; }
.star-btn { color: #D1D5DB; }
.star-btn.fav { color: var(--warn); }

/* Flashcard Tab UI */
.fc-card { background: #fff; border-radius: 16px; border: 1px solid var(--border); height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; cursor: pointer; user-select: none; }
.fc-fav { position: absolute; top: 16px; right: 16px; font-size: 22px; background: none; border: none; cursor: pointer; color: #D1D5DB; }
.fc-fav.fav { color: var(--warn); }
.fc-word { font-size: 26px; font-weight: 800; color: #111827; margin-bottom: 12px; word-break: break-all; }
.fc-meaning { font-size: 18px; font-weight: 700; color: var(--primary); display: none; }
.fc-card.flipped .fc-meaning { display: block; }
.fc-hint { font-size: 12px; color: var(--gray); margin-top: 10px; }
.fc-nav { display: flex; gap: 10px; }
.fc-nav-btn { flex: 1; padding: 14px 0; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; }
.fc-nav-btn.sec { background: #E5E7EB; color: #374151; }

/* Test Tab UI */
.setup-card { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; display: block; }
.form-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
.btn-primary { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; }

.test-progress { font-size: 13px; font-weight: 700; color: var(--gray); display: flex; justify-content: space-between; margin-bottom: 8px; }
.progress-bar-bg { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
.progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.t-word-box { background: #fff; border-radius: 16px; padding: 24px 16px; border: 1px solid var(--border); text-align: center; margin-bottom: 16px; }
.t-word { font-size: 24px; font-weight: 800; color: #111827; }

.t-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.topt { width: 100%; padding: 14px 16px; background: #fff; border: 1px solid var(--border); border-radius: 12px; text-align: left; font-size: 14px; font-weight: 600; color: #374151; cursor: pointer; transition: all 0.2s; }
.topt.correct { background: #D1FAE5; border-color: var(--success); color: #065F46; font-weight: 700; }
.topt.wrong { background: #FEE2E2; border-color: var(--danger); color: #991B1B; font-weight: 700; }

.next-btn { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; display: none; }

/* Result Screen */
.result-box { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid var(--border); text-align: center; }
.res-emoji { font-size: 48px; margin-bottom: 8px; }
.res-score { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
.res-percent { font-size: 14px; color: var(--gray); margin-bottom: 20px; font-weight: 600; }
.wrong-title { text-align: left; font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.wrong-list { text-align: left; margin-bottom: 20px; max-height: 200px; overflow-y: auto; }
.wrong-item { font-size: 12px; margin-bottom: 8px; line-height: 1.4; color: #374151; }
.wrong-item .w-w { font-weight: 700; color: var(--danger); }
.wrong-item .w-i { color: var(--gray); text-decoration: line-through; }
.wrong-item .w-c { color: var(--success); font-weight: 700; }
.res-btn-group { display: flex; flex-direction: column; gap: 8px; }
.btn-kakao { width: 100%; padding: 12px; background: #25D366; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; }
.btn-retry { width: 100%; padding: 12px; background: #E5E7EB; color: #374151; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <div class="header-brand en">씨유에탑 ✦ 영어단어장</div>
    <div class="header-sub">수능보카 final 2 · 총 4300단어</div>
  </div>

  <div class="tabs">
    <button id="tb-list" class="tab-btn active" onclick="switchTab('list')">단어목록</button>
    <button id="tb-flash" class="tab-btn" onclick="switchTab('flash')">플래시카드</button>
    <button id="tb-test" class="tab-btn" onclick="switchTab('test')">📝 테스트</button>
  </div>

  <div class="content">
    <!-- TAB 1: LIST -->
    <div id="tab-list" class="tab-pane active">
      <div id="lrbar" class="range-bar"></div>
      <input type="text" id="sch" class="search-box" placeholder="영어 단어 또는 한글 뜻 검색..." oninput="renderList()">
      <div class="filter-bar">
        <button id="flt-all" class="filter-btn active" onclick="setFilter('all')">전체</button>
        <button id="flt-unk" class="filter-btn" onclick="setFilter('unk')">모름</button>
        <button id="flt-fav" class="filter-btn" onclick="setFilter('fav')">⭐ 즐겨찾기</button>
      </div>
      <div id="word-list"></div>
    </div>

    <!-- TAB 2: FLASHCARD -->
    <div id="tab-flash" class="tab-pane">
      <div id="fcrbar" class="range-bar"></div>
      <div id="fccard" class="fc-card">
        <button id="fcfav" class="fc-fav" onclick="toggleFcFav(event)">★</button>
        <div id="fcword" class="fc-word en">word</div>
        <div id="fcmeaning" class="fc-meaning">뜻</div>
        <div class="fc-hint">터치하여 뜻 확인</div>
      </div>
      <div class="fc-nav">
        <button class="fc-nav-btn sec" onclick="fcPrev()">◀ 이전</button>
        <button class="fc-nav-btn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
        <button class="fc-nav-btn" onclick="fcNext()">다음 ▶</button>
      </div>
    </div>

    <!-- TAB 3: TEST -->
    <div id="tab-test" class="tab-pane">
      <div id="t-setup" class="setup-card">
        <div class="form-group">
          <label class="form-label">학생 이름</label>
          <input type="text" id="t-name" class="form-input" placeholder="이름을 입력하세요">
        </div>
        <div class="form-group">
          <label class="form-label">테스트 범위</label>
          <div id="trbar" class="range-bar"></div>
        </div>
        <button class="btn-primary" onclick="startTest()">테스트 시작 ▶</button>
      </div>

      <div id="t-play" style="display:none;">
        <div class="test-progress">
          <span id="t-counter">1 / 50</span>
          <span id="t-correct-count">✅ 0</span>
        </div>
        <div class="progress-bar-bg">
          <div id="t-pg-fill" class="progress-bar-fill"></div>
        </div>
        <div class="t-word-box">
          <div id="t-word" class="t-word en">word</div>
        </div>
        <div id="toptions" class="t-options"></div>
        <button id="t-next-btn" class="next-btn" onclick="tNext()">다음 →</button>
      </div>

      <div id="t-result" style="display:none;"></div>
    </div>
  </div>
</div>

var STORE_KEY = "cutop_sooneungvoca_final2";
var store = {};

try {
  var saved = localStorage.getItem(STORE_KEY);
  if (saved) store = JSON.parse(saved);
} catch(e) {}

function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch(e) {}
}

function getMeta(w) {
  var k = w.word + "|" + w.meaning;
  return store[k] || { status: "", fav: false };
}

function setMeta(w, status, fav) {
  var k = w.word + "|" + w.meaning;
  store[k] = { status: status, fav: fav };
  saveStore();
}

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function speak(t) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US";
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function speakFc() {
  speak(document.getElementById("fcword").textContent);
}

function buildRanges(ws) {
  var r = [{ label: "전체", s: 0, e: ws.length }];
  for (var i = 0; i < ws.length; i += 50) {
    r.push({ label: (i+1) + "-" + Math.min(i+50, ws.length), s: i, e: Math.min(i+50, ws.length) });
  }
  return r;
}

var ranges = buildRanges(rawWords);
var lri = 0, fri = 0, tri = 0;
var filterType = "all";

function renderRangeBar(elId, curIdx, fnName) {
  var el = document.getElementById(elId);
  var html = "";
  for (var i = 0; i < ranges.length; i++) {
    var cls = (i === curIdx) ? "range-btn active" : "range-btn";
    html += '<button class="' + cls + '" onclick="' + fnName + '(' + i + ')">' + ranges[i].label + '</button>';
  }
  el.innerHTML = html;
}

function switchTab(t) {
  ["list","flash","test"].forEach(function(n) {
    document.getElementById("tb-"+n).classList.toggle("active", n===t);
    document.getElementById("tab-"+n).classList.toggle("active", n===t);
  });
  if (t==="list")  { renderRangeBar("lrbar", lri, "setLR"); renderList(); }
  if (t==="flash") { renderRangeBar("fcrbar", fri, "setFR"); initFC(); }
  if (t==="test")  { renderSetup(); }
}

/* LIST LOGIC */
function setLR(i) { lri = i; renderRangeBar("lrbar", lri, "setLR"); renderList(); }
function setFilter(f) {
  filterType = f;
  ["all","unk","fav"].forEach(function(k){
    document.getElementById("flt-"+k).classList.toggle("active", k===f);
  });
  renderList();
}

function renderList() {
  var r = ranges[lri];
  var sub = rawWords.slice(r.s, r.e);
  var q = document.getElementById("sch").value.trim().toLowerCase();
  var container = document.getElementById("word-list");
  var html = "";

  for (var i = 0; i < sub.length; i++) {
    var w = sub[i];
    var m = getMeta(w);
    
    if (filterType === "unk" && m.status === "known") continue;
    if (filterType === "fav" && !m.fav) continue;

    if (q) {
      var matchW = w.word.toLowerCase().indexOf(q) !== -1;
      var matchM = w.meaning.toLowerCase().indexOf(q) !== -1;
      if (!matchW && !matchM) continue;
    }

    var isKnown = m.status === "known";
    var isFav = m.fav;

    html += '<div class="word-card' + (isKnown ? ' known' : '') + '">';
    html += '  <div class="chk-btn" data-w="' + esc(w.word) + '" data-m="' + esc(w.meaning) + '" onclick="toggleKnown(this)">' + (isKnown ? '✓' : '') + '</div>';
    html += '  <div class="word-info">';
    html += '    <div class="word-title en">' + esc(w.word) + '</div>';
    html += '    <div class="word-meaning">' + esc(w.meaning) + '</div>';
    html += '  </div>';
    html += '  <button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>';
    html += '  <button class="ibtn star-btn' + (isFav ? ' fav' : '') + '" data-w="' + esc(w.word) + '" data-m="' + esc(w.meaning) + '" onclick="toggleListFav(this)">★</button>';
    html += '</div>';
  }
  container.innerHTML = html || '<div style="text-align:center; padding:30px; color:var(--gray); font-size:14px;">조건에 맞는 단어가 없습니다.</div>';
}

function toggleKnown(el) {
  var w = { word: el.dataset.w, meaning: el.dataset.m };
  var m = getMeta(w);
  var nextStatus = (m.status === "known") ? "" : "known";
  setMeta(w, nextStatus, m.fav);
  renderList();
}

function toggleListFav(el) {
  var w = { word: el.dataset.w, meaning: el.dataset.m };
  var m = getMeta(w);
  setMeta(w, m.status, !m.fav);
  renderList();
}

/* FLASHCARD LOGIC */
var fcList = [];
var fcIdx = 0;
var fcFlipped = false;
var fcTX = 0;

function setFR(i) { fri = i; renderRangeBar("fcrbar", fri, "setFR"); initFC(); }

function initFC() {
  var r = ranges[fri];
  fcList = rawWords.slice(r.s, r.e);
  fcIdx = 0;
  showFC();
}

function showFC() {
  if (!fcList.length) return;
  fcFlipped = false;
  var card = document.getElementById("fccard");
  card.classList.remove("flipped");
  var w = fcList[fcIdx];
  var m = getMeta(w);

  document.getElementById("fcword").textContent = w.word;
  document.getElementById("fcmeaning").textContent = w.meaning;
  var favBtn = document.getElementById("fcfav");
  favBtn.classList.toggle("fav", !!m.fav);
}

function fcFlip() {
  if (fcFlipped) return;
  fcFlipped = true;
  document.getElementById("fccard").classList.add("flipped");
  speakFc();
}

function fcPrev() {
  if (fcIdx > 0) { fcIdx--; showFC(); }
}

function fcNext() {
  if (fcIdx < fcList.length - 1) { fcIdx++; showFC(); }
}

function toggleFcFav(e) {
  e.stopPropagation();
  if (!fcList.length) return;
  var w = fcList[fcIdx];
  var m = getMeta(w);
  setMeta(w, m.status, !m.fav);
  document.getElementById("fcfav").classList.toggle("fav", !m.fav);
}

(function(){
  var card = document.getElementById("fccard");
  card.addEventListener("click", function(e) {
    if (e.target.id === "fcfav") return;
    fcFlip();
  });
  card.addEventListener("touchstart", function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
})();

function shuffle(array) {
  var arr = array.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}

  }

  var opts = [
    { text: tCurWord.meaning, cor: true }
  ];

  }
  opts = shuffle(opts);

  var html = "";
  for (var m = 0; m < opts.length; m++) {
    html += '<button class="topt" data-cor="' + (opts[m].cor ? "1" : "0") + '" data-txt="' + esc(opts[m].text) + '" onclick="tAns(this)">' + esc(opts[m].text) + '</button>';
  }
  optsContainer.innerHTML = html;
}

function tAns(el) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll("#toptions .topt");
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    if (b.getAttribute("data-cor") === "1") b.className += " correct";
    else if (b === el) b.className += " wrong";
    b.style.pointerEvents = "none";
  }
  var ok = el.getAttribute("data-cor") === "1";
  var selTxt = el.getAttribute("data-txt");

  if (ok) {
    tCorrect++;
    tRightList.push(tCurWord.word);
    speak(tCurWord.word);
  } else {
    tWrongList.push({
      word: tCurWord.word,
      sel: selTxt,
      ans: tCurWord.meaning
    });
  }

  var nextBtn = document.getElementById("t-next-btn");
  if (tIdx === tPool.length - 1) {
    nextBtn.textContent = "결과 보기 →";
  } else {
    nextBtn.textContent = "다음 →";
  }
  nextBtn.style.display = "block";
}

function tNext() {
  if (tIdx < tPool.length - 1) {
    tIdx++;
    showTestItem();
  } else {
    showTestResult();
  }
}

function showTestResult() {
  document.getElementById("t-play").style.display = "none";
  var resBox = document.getElementById("t-result");
  resBox.style.display = "block";

  var total = tPool.length;
  var pct = Math.round((tCorrect / total) * 100);
  var emoji = "🏆";
  if (pct < 100 && pct >= 80) emoji = "🎉";
  else if (pct < 80 && pct >= 60) emoji = "👍";
  else if (pct < 60) emoji = "💪";

  var html = '<div class="result-box">';
  html += '  <div class="res-emoji">' + emoji + '</div>';
  html += '  <div class="res-score">' + tCorrect + ' / ' + total + '</div>';
  html += '  <div class="res-percent">(' + pct + '점)</div>';

  if (tWrongList.length > 0) {
    html += '  <div class="wrong-title">❌ 틀린 단어 (' + tWrongList.length + '개)</div>';
    html += '  <div class="wrong-list">';
    for (var i = 0; i < tWrongList.length; i++) {
      var item = tWrongList[i];
      html += '    <div class="wrong-item">';
      html += '      <span class="w-w">' + esc(item.word) + '</span> → ';
      html += '      입력:<span class="w-i">' + esc(item.sel) + '</span> / ';
      html += '      정답:<span class="w-c">' + esc(item.ans) + '</span>';
      html += '    </div>';
    }
    html += '  </div>';
  }

  html += '  <div class="res-btn-group">';
  html += '    <button class="btn-kakao" onclick="copyKakao()">📋 카톡으로 결과 복사</button>';
  html += '    <button class="btn-retry" onclick="renderSetup()">↩ 다시 테스트</button>';
  html += '  </div>';
  html += '</div>';

  resBox.innerHTML = html;
}

function copyKakao() {
  var d = new Date();
  var dateStr = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  var total = tPool.length;
  var pct = Math.round((tCorrect / total) * 100);

  var txt = "[씨유에탑 수능보카 final 2] 테스트 결과\n";
  txt += "날짜: " + dateStr + "\n";
  txt += "이름: " + tName + "\n";
  txt += "점수: " + tCorrect + "/" + total + " (" + pct + "점)\n";
  txt += "─────────────────\n";
  txt += "❌ 틀린 단어 (" + tWrongList.length + "개)\n";

  for (var i = 0; i < tWrongList.length; i++) {
    var item = tWrongList[i];
    txt += "  " + item.word + " → 입력:" + item.sel + " / 정답:" + item.ans + "\n";
  }

  txt += "─────────────────\n";
  txt += "✅ 맞은 단어: " + tRightList.join(", ");

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      alert("결과가 클립보드에 복사되었습니다.");
    });
  } else {
    var ta = document.createElement("textarea");
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("결과가 클립보드에 복사되었습니다.");
  }
}

// Initial setup
renderRangeBar("lrbar", 0, "setLR");
renderList();
</script>
