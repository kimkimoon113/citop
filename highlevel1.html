<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>씨유에탑 영어단어장 - 고교 필수어휘 2000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --success: #10B981;
  --danger: #EF4444;
  --warn: #F59E0B;
  --gray: #6B7280;
  --border: #E5E7EB;
  --bg: #F9FAFB;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { font-family: 'Noto Sans KR', sans-serif; color: #111827; }
.app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
.hdr { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 18px 18px 14px; }
.hdr h1 { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; }
.hdr h1 span { color: #FDE68A; margin: 0 4px; }
.hdr p { font-size: 13px; opacity: 0.88; margin-top: 4px; font-family: 'Nunito', 'Noto Sans KR', sans-serif; font-weight: 700; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.tab { flex: 1; padding: 12px 4px; border: none; background: none; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; color: var(--gray); cursor: pointer; border-bottom: 3px solid transparent; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.pane { display: none; padding: 14px; flex: 1; }
.pane.on { display: block; }

.rbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px 0; margin-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 0; }
.rbar::-webkit-scrollbar { display: none; }
.rbtn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Nunito', sans-serif; }
.rbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }

.search { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; outline: none; background: #fff; margin-bottom: 10px; }
.search:focus { border-color: var(--primary); }
.filters { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
.fbtn { padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 700; color: var(--gray); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.fbtn.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.cnt { margin-left: auto; font-size: 12px; color: var(--gray); font-family: 'Nunito', sans-serif; font-weight: 700; }
.wcard { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 10px; margin-bottom: 7px; transition: opacity 0.2s; }
.wcard.known { opacity: 0.35; }
.chk { width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; border: 2px solid var(--border); background: #fff; color: #fff; font-size: 14px; font-weight: 900; cursor: pointer; }
.chk.on { background: var(--success); border-color: var(--success); }
.wbody { flex: 1; min-width: 0; }
.wword { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: #111827; word-break: break-word; }
.wmean { font-size: 13px; color: #4B5563; margin-top: 2px; word-break: keep-all; }
.wacts { display: flex; gap: 2px; flex-shrink: 0; }
.ibtn { width: 34px; height: 34px; border: none; background: none; font-size: 17px; cursor: pointer; border-radius: 8px; }
.ibtn:active { background: var(--primary-light); }
.favbtn { color: #D1D5DB; font-size: 20px; }
.favbtn.on { color: var(--warn); }
.empty { text-align: center; color: var(--gray); padding: 40px 0; font-size: 14px; }
.more { width: 100%; padding: 12px; border: 1.5px dashed var(--border); background: #fff; border-radius: 12px; color: var(--primary); font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; margin-top: 4px; }

#fccard { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 20px; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; box-shadow: 0 6px 20px rgba(37,99,235,0.08); cursor: pointer; user-select: none; -webkit-user-select: none; text-align: center; }
#fcctr { position: absolute; top: 14px; left: 16px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: var(--gray); }
#fcfavbtn { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 26px; color: #D1D5DB; cursor: pointer; padding: 4px 6px; }
#fcfavbtn.on { color: var(--warn); }
#fcword { font-family: 'Nunito', sans-serif; font-size: 34px; font-weight: 900; color: var(--primary-dark); word-break: break-word; }
#fcmean { display: none; font-size: 19px; font-weight: 700; color: #374151; margin-top: 18px; padding-top: 18px; border-top: 2px dashed var(--border); word-break: keep-all; line-height: 1.5; width: 100%; }
#fctap { margin-top: 18px; font-size: 13px; color: var(--gray); }
.fcnav { display: flex; gap: 8px; margin-top: 14px; }
.fcbtn { flex: 1; padding: 13px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
.fcbtn.sec { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.fchint { text-align: center; font-size: 12px; color: var(--gray); margin-top: 10px; }

.tbox { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
.tlabel { font-size: 13px; font-weight: 700; color: #374151; margin: 0 0 8px; }
.tinput { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; font-family: 'Noto Sans KR', sans-serif; outline: none; margin-bottom: 16px; }
.tinput:focus { border-color: var(--primary); }
.qcnt { display: inline-block; padding: 8px 16px; border-radius: 10px; background: var(--primary); color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; margin-bottom: 16px; }
.bigbtn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; margin-top: 8px; }
.bigbtn:active { background: var(--primary-dark); }
.tprog { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.tprog div { height: 100%; background: var(--primary); transition: width 0.3s; }
.tmeta { display: flex; justify-content: space-between; font-family: 'Nunito', 'Noto Sans KR', sans-serif; font-weight: 800; font-size: 13px; color: var(--gray); margin-bottom: 12px; }
.tmeta .ok { color: var(--success); }
.tq { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 24px 16px; text-align: center; margin-bottom: 12px; }
.tqword { font-family: 'Nunito', sans-serif; font-size: 30px; font-weight: 900; color: var(--primary-dark); word-break: break-word; }
.tqph { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--gray); margin-top: 4px; min-height: 0; }
.tqspk { margin-top: 10px; border: none; background: var(--primary-light); color: var(--primary); border-radius: 20px; padding: 6px 14px; font-size: 15px; cursor: pointer; }
.topt { display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-size: 15px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; color: #111827; cursor: pointer; word-break: keep-all; line-height: 1.45; }
.topt:active { background: var(--primary-light); }
.topt.correct { background: #D1FAE5; border-color: var(--success); color: #065F46; font-weight: 700; }
.topt.wrong { background: #FEE2E2; border-color: var(--danger); color: #991B1B; font-weight: 700; }
#t-next-btn { display: none; }
.rscore { text-align: center; padding: 10px 0 16px; }
.remo { font-size: 54px; }
.rnum { font-family: 'Nunito', sans-serif; font-size: 40px; font-weight: 900; color: var(--primary-dark); margin-top: 4px; }
.rpct { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: var(--gray); }
.rname { font-size: 14px; color: #374151; margin-top: 6px; }
.rsec { font-size: 14px; font-weight: 700; margin: 16px 0 8px; }
.ritem { background: #FEF2F2; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font-size: 13px; line-height: 1.55; }
.ritem b { font-family: 'Nunito', sans-serif; font-size: 15px; }
.ritem .ra { color: var(--danger); }
.ritem .rc { color: var(--success); font-weight: 700; }
.kakao { background: #25D366; }
.retry { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
</style>
</head>

<div class="app">
  <div class="hdr">
    <h1>씨유에탑<span>✦</span>영어단어장</h1>
    <p id="hsub"></p>
  </div>
  <div class="tabs">
    <button class="tab on" id="tb-w" onclick="showTab('w')">📖 단어목록</button>
    <button class="tab" id="tb-fc" onclick="showTab('fc')">🃏 플래시카드</button>

  </div>

  <div class="pane on" id="pane-w">
    <div class="rbar" id="wrbar"></div>
    <input class="search" id="wsearch" type="text" placeholder="🔍 영어 또는 한글로 검색" oninput="onSearch()">
    <div class="filters">
      <button class="fbtn on" id="f-all" onclick="setFilter('all')">전체</button>

      <button class="fbtn" id="f-fav" onclick="setFilter('fav')">⭐즐겨찾기</button>
      <span class="cnt" id="wcnt"></span>
    </div>
    <div id="wlist"></div>
  </div>

  <div class="pane" id="pane-fc">
    <div class="rbar" id="fcrbar"></div>
    <div id="fccard">
      <span id="fcctr"></span>
      <button id="fcfavbtn" onclick="fcToggleFav()">☆</button>
      <div id="fcword"></div>
      <div id="fcmean"></div>
      <div id="fctap">👆 탭해서 뜻 보기</div>
    </div>
    <div class="fcnav">
      <button class="fcbtn sec" onclick="fcPrev()">◀ 이전</button>
      <button class="fcbtn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
      <button class="fcbtn" onclick="fcNext()">다음 ▶</button>
    </div>
    <div class="fchint">← 좌우로 스와이프해서 넘기기 →</div>
  </div>

  <div class="pane" id="pane-t">
    <div id="tarea"></div>
  </div>
</div>

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function speak(t) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() { speak(document.getElementById('fcword').textContent); }

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

/* ---------- storage ---------- */
var ST = {};
try { ST = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { ST = {}; }
function saveST() { try { localStorage.setItem(STORE_KEY, JSON.stringify(ST)); } catch (e) {} }
function skey(w) { return w.word + '|' + w.meaning; }
function getS(w) { var s = ST[skey(w)]; return s ? s : { status: '', fav: false }; }
function setS(w, s) { ST[skey(w)] = s; saveST(); }

/* ---------- ranges ---------- */
function buildRanges(ws) {
  var r = [{label:'전체', s:0, e:ws.length}];
  for (var i = 0; i < ws.length; i += 50) {
    var e = Math.min(i + 50, ws.length);
    r.push({label:(i+1)+'~'+e, s:i, e:e});
  }
  return r;
}
var RANGES = buildRanges(rawWords);

function renderRangeBar(barId, ri, fn) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    var cls = 'rbtn' + (i === ri ? ' on' : '');
    h.push('<button class="' + cls + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  bar.innerHTML = h.join('');
  var on = bar.querySelector('.rbtn.on');
  if (on && on.scrollIntoView) {
    bar.scrollLeft = on.offsetLeft - bar.offsetLeft - 40;
  }
}

function wordsForRange(ri) {
  var r = RANGES[ri];
  return rawWords.slice(r.s, r.e);
}

/* ---------- tab 1: list ---------- */
var wri = RANGES.length > 1 ? 1 : 0;
var wfilter = 'all';
var wquery = '';
var wshow = 100;
var PAGE = 100;

function setWR(el) { wri = parseInt(el.getAttribute('data-i'), 10); wshow = PAGE; renderList(); window.scrollTo(0, 0); }
function setFilter(f) {
  wfilter = f; wshow = PAGE;
  var ids = ['all','unk','fav'];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById('f-' + ids[i]).classList.toggle('on', ids[i] === f);
  }
  renderList();
}
var sTimer = null;
function onSearch() {
  if (sTimer) clearTimeout(sTimer);
  sTimer = setTimeout(function() {
    wquery = document.getElementById('wsearch').value.replace(/^\s+|\s+$/g, '').toLowerCase();
    wshow = PAGE;
    renderList();
  }, 150);
}
function showMore() { wshow += PAGE; renderList(); }

function renderList() {
  renderRangeBar('wrbar', wri, 'setWR');
  var pool = wordsForRange(wri);
  var list = [];
  for (var k = 0; k < pool.length; k++) {
    var pw = pool[k], ps = getS(pw);
    if (wfilter === 'unk' && ps.status === 'known') continue;
    if (wfilter === 'fav' && !ps.fav) continue;
    if (wquery) {
      if (pw.word.toLowerCase().indexOf(wquery) < 0 && pw.meaning.toLowerCase().indexOf(wquery) < 0) continue;
    }
    list.push(pw);
  }
  var n = Math.min(list.length, wshow);
  var h = [];
  for (var i = 0; i < n; i++) {
    var w = list[i], s = getS(w);
    var known = s.status === 'known', fav = s.fav;
    h.push('<div class="wcard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="wbody">');
    h.push('<div class="wword">' + esc(w.word) + '</div>');
    h.push('<div class="wmean">' + esc(w.meaning) + '</div>');
    h.push('</div>');
    h.push('<div class="wacts">');
    h.push('<button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (fav ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleFav(this)">' + (fav ? '★' : '☆') + '</button>');
    h.push('</div>');
    h.push('</div>');
  }
  if (!list.length) h.push('<div class="empty">해당하는 단어가 없어요</div>');
  if (list.length > n) h.push('<button class="more" onclick="showMore()">더 보기 (' + (list.length - n) + '개 남음)</button>');
  document.getElementById('wlist').innerHTML = h.join('');
  document.getElementById('wcnt').textContent = list.length + '단어';
  window._wlist = list;
}

function toggleKnown(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  var s = getS(w);
  setS(w, { status: s.status === 'known' ? '' : 'known', fav: !!s.fav });
  renderList();
}
function toggleFav(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  var s = getS(w);
  setS(w, { status: s.status || '', fav: !s.fav });
  renderList();
}

/* ---------- tab 2: flashcard ---------- */
var fri = RANGES.length > 1 ? 1 : 0;
var fcPool = [];
var fcIdx = 0;
var fcFlipped = false;
var fcTX = 0;

function setFCR(el) { fri = parseInt(el.getAttribute('data-i'), 10); fcIdx = 0; fcInit(); }

var fcEvReg = false;
function fcRegisterEvents() {
  if (fcEvReg) return;
  fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e) {
    if (e.target.id === 'fcfavbtn') return;
    fcFlip();
  });
  card.addEventListener('touchstart', function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  fcPool = wordsForRange(fri);
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function fcShow() {
  if (!fcPool.length) return;
  fcFlipped = false;
  var w = fcPool[fcIdx];
  document.getElementById('fcword').textContent = w.word;
  document.getElementById('fcmean').textContent = w.meaning;
  document.getElementById('fcmean').style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  var fb = document.getElementById('fcfavbtn');
  var fav = getS(w).fav;
  fb.textContent = fav ? '★' : '☆';
  fb.className = fav ? 'on' : '';
}
function fcFlip() {
  if (fcFlipped) return;
  if (!fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcmean').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].word);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }
function fcToggleFav() {
  if (!fcPool.length) return;
  var w = fcPool[fcIdx], s = getS(w);
  setS(w, { status: s.status || '', fav: !s.fav });
  var fb = document.getElementById('fcfavbtn');
  fb.textContent = !s.fav ? '★' : '☆';
  fb.className = !s.fav ? 'on' : '';
}

var tri = RANGES.length > 1 ? 1 : 0;
var tName = '';
var tQs = [];
var tIdx = 0;
var tCorrect = 0;
var tLocked = false;
var tResults = [];
var tCurOpts = [];
var T_COUNT = 50;

function setTR(el) { tri = parseInt(el.getAttribute('data-i'), 10); renderRangeBar('trbar', tri, 'setTR'); }

function tSetup() {
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="tlabel">이름</div>');
  h.push('<input class="tinput" id="tname" type="text" placeholder="이름을 입력하세요" value="' + esc(tName) + '">');
  h.push('<div class="tlabel">문제 수</div>');
  h.push('<div class="qcnt">50문제</div>');

  h.push('<div class="rbar" id="trbar"></div>');
  h.push('<button class="bigbtn" onclick="tStart()">테스트 시작 ▶</button>');
  h.push('</div>');
  document.getElementById('tarea').innerHTML = h.join('');
  renderRangeBar('trbar', tri, 'setTR');

function tStart() {
  var nm = document.getElementById('tname').value.replace(/^\s+|\s+$/g, '');
  if (!nm) { alert('이름을 입력해주세요!'); document.getElementById('tname').focus(); return; }
  tName = nm;
  var pool = wordsForRange(tri);
  tQs = shuffle(pool).slice(0, T_COUNT);
  tIdx = 0; tCorrect = 0; tResults = [];
  tShowQ();
}

function tBuildOptions(w) {
  var opts = [w.meaning];
  var used = {};
  used[w.meaning] = true;
  var tries = 0;
  while (opts.length < 4 && tries < 500) {
    tries++;
    var c = rawWords[Math.floor(Math.random() * rawWords.length)];
    if (used[c.meaning]) continue;
    used[c.meaning] = true;
    opts.push(c.meaning);
  }
  return shuffle(opts);
}

function tShowQ() {
  tLocked = false;
  var w = tQs[tIdx];
  tCurOpts = tBuildOptions(w);
  var pct = Math.round(tIdx / tQs.length * 100);
  var h = [];
  h.push('<div class="tprog"><div style="width:' + pct + '%"></div></div>');
  h.push('<div class="tmeta"><span>' + (tIdx + 1) + ' / ' + tQs.length + '</span><span class="ok">✔ ' + tCorrect + '</span></div>');
  h.push('<div class="tq">');
  h.push('<div class="tqword">' + esc(w.word) + '</div>');
  h.push('<div class="tqph">' + (w.phon ? esc(w.phon) : '') + '</div>');
  h.push('<button class="tqspk" onclick="tSpeak()">🔊 발음 듣기</button>');
  h.push('</div>');
  h.push('<div id="toptions">');
  for (var i = 0; i < tCurOpts.length; i++) {
    h.push('<button class="topt" data-oi="' + i + '" onclick="tPick(this)">' + esc(tCurOpts[i]) + '</button>');
  }
  h.push('</div>');
  h.push('<button class="bigbtn" id="t-next-btn" onclick="tNext()">' + (tIdx === tQs.length - 1 ? '결과 보기 →' : '다음 →') + '</button>');
  document.getElementById('tarea').innerHTML = h.join('');
  speak(w.word);
}

function tSpeak() { speak(tQs[tIdx].word); }

function tPick(el) {
  var chosen = tCurOpts[parseInt(el.getAttribute('data-oi'), 10)];
  tAnswer(el, chosen, tQs[tIdx].meaning);
}

function tAnswer(el, chosen, correct) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll('#toptions .topt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    var bt = tCurOpts[parseInt(b.getAttribute('data-oi'), 10)];
    if (bt === correct) b.className += ' correct';
    else if (b === el) b.className += ' wrong';
    b.style.pointerEvents = 'none';
  }
  var ok = (chosen === correct);
  if (ok) tCorrect++;
  tResults.push({ word: tQs[tIdx].word, meaning: correct, ans: chosen, ok: ok });
  var okEl = document.querySelector('.tmeta .ok');
  if (okEl) okEl.textContent = '✔ ' + tCorrect;
  document.getElementById('t-next-btn').style.display = 'block';
}

function tNext() {
  if (!tLocked) return;
  tIdx++;
  if (tIdx >= tQs.length) { tShowResult(); return; }
  tShowQ();
  window.scrollTo(0, 0);
}

function tShowResult() {
  var total = tQs.length;
  var pct = total ? Math.round(tCorrect / total * 100) : 0;
  var emo = pct === 100 ? '🏆' : (pct >= 80 ? '🎉' : (pct >= 60 ? '👍' : '💪'));
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) right.push(tResults[i]); else wrong.push(tResults[i]);
  }
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="rscore">');
  h.push('<div class="remo">' + emo + '</div>');
  h.push('<div class="rnum">' + tCorrect + ' / ' + total + '</div>');
  h.push('<div class="rpct">' + pct + '점</div>');
  h.push('<div class="rname">' + esc(tName) + ' · ' + RANGES[tri].label + '</div>');
  h.push('</div>');
  if (wrong.length) {
    h.push('<div class="rsec">❌ 틀린 단어 (' + wrong.length + '개)</div>');
    for (var j = 0; j < wrong.length; j++) {
      var r = wrong[j];
      h.push('<div class="ritem"><b>' + esc(r.word) + '</b><br>');
      h.push('<span class="ra">입력: ' + esc(r.ans) + '</span><br>');
      h.push('<span class="rc">정답: ' + esc(r.meaning) + '</span></div>');
    }
  } else {
    h.push('<div class="rsec">🎯 모두 맞혔어요!</div>');
  }
  h.push('<button class="bigbtn kakao" onclick="tCopy()">📋 카톡으로 결과 복사</button>');
  h.push('<button class="bigbtn retry" onclick="tSetup()">↩ 다시 테스트</button>');
  h.push('</div>');
  document.getElementById('tarea').innerHTML = h.join('');
  window.scrollTo(0, 0);
}

function tCopyText() {
  var d = new Date();
  var ds = d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  var total = tQs.length;
  var pct = total ? Math.round(tCorrect / total * 100) : 0;
  var line = '─────────────────';
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) right.push(tResults[i].word); else wrong.push(tResults[i]);
  }
  var L = [];
  L.push('[씨유에탑 ' + SERIES + '] 테스트 결과');
  L.push('날짜: ' + ds);
  L.push('이름: ' + tName);
  L.push('점수: ' + tCorrect + '/' + total + ' (' + pct + '점)');
  L.push(line);
  L.push('❌ 틀린 단어 (' + wrong.length + '개)');
  for (var j = 0; j < wrong.length; j++) {
    L.push('  ' + wrong[j].word + ' → 입력:' + wrong[j].ans + ' / 정답:' + wrong[j].meaning);
  }
  L.push(line);
  L.push('✅ 맞은 단어: ' + right.join(', '));
  return L.join('\n');
}

function tCopy() {
  var txt = tCopyText();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, txt.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    alert(ok ? '결과가 복사되었어요! 카톡에 붙여넣기 하세요.' : '복사에 실패했어요. 다시 시도해주세요.');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      alert('결과가 복사되었어요! 카톡에 붙여넣기 하세요.');
    }, fallback);
  } else {
    fallback();
  }
}

/* ---------- tabs ---------- */
var TABS = ['w','fc','t'];
function showTab(id) {
  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];
    document.getElementById('pane-' + t).classList.toggle('on', t === id);
    document.getElementById('tb-' + t).classList.toggle('on', t === id);
  }
  if (id === 'w')  { renderRangeBar('wrbar', wri, 'setWR'); renderList(); }
  if (id === 'fc') { fcInit(); }
  if (id === 't')  { tSetup(); }
  window.scrollTo(0, 0);
}

document.getElementById('hsub').textContent = SERIES + ' · 총 ' + rawWords.length + '단어';
renderList();
</script>
