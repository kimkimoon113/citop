  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() { speak(document.getElementById('fcword').textContent); }

/* ---------- storage ---------- */
var ST = {};
try { ST = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { ST = {}; }
function saveST() { try { localStorage.setItem(SKEY, JSON.stringify(ST)); } catch (e) {} }
function sk(w) { return w.word + '|' + w.meaning; }
function getS(w) { var s = ST[sk(w)]; return s ? s : {status:'', fav:false}; }
function setS(w, k, v) {
  var key = sk(w);
  if (!ST[key]) ST[key] = {status:'', fav:false};
  ST[key][k] = v;
  saveST();
}

/* ---------- ranges ---------- */
function buildRanges(ws) {
  var r = [{label:'전체', s:0, e:ws.length}];
  for (var i = 0; i < ws.length; i += 50) {
    var e = Math.min(i + 50, ws.length);
    r.push({label:(i+1)+'~'+e, s:i, e:e});
  }
  return r;
}
var RANGES = buildRanges(rawWords);
function renderRangeBar(barId, ri, fn) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    var cls = 'rbtn' + (i === ri ? ' on' : '');
    h.push('<button class="' + cls + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  bar.innerHTML = h.join('');
  var on = bar.querySelector('.rbtn.on');
  if (on) { bar.scrollLeft = on.offsetLeft - bar.offsetLeft - 40; }
}
function wordsForRange(ri) {
  var r = RANGES[ri];
  return rawWords.slice(r.s, r.e);
}
function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

/* ---------- tab 1: list ---------- */
var wri = 1, wfilter = 'all', wq = '';
function setWR(el) { wri = parseInt(el.getAttribute('data-i'), 10); renderList(); document.getElementById('wlist').scrollTop = 0; window.scrollTo(0, 0); }
function setWF(f) {
  wfilter = f;
  var bs = document.querySelectorAll('.fbtn');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-f') === f);
  renderList();
}
function onSearch(el) { wq = el.value.replace(/^\s+|\s+$/g, '').toLowerCase(); renderList(); }
function renderList() {
  renderRangeBar('wrbar', wri, 'setWR');
  var pool = wq ? rawWords : wordsForRange(wri);
  var list = [];
  for (var k = 0; k < pool.length; k++) {
    var x = pool[k], sx = getS(x);
    if (wfilter === 'unk' && sx.status === 'known') continue;
    if (wfilter === 'fav' && !sx.fav) continue;
    if (wq && x.word.toLowerCase().indexOf(wq) < 0 && x.meaning.toLowerCase().indexOf(wq) < 0) continue;
    list.push(x);
  }
  var h = [];
  if (!list.length) h.push('<div class="empty">표시할 단어가 없어요</div>');
  for (var i = 0; i < list.length; i++) {
    var w = list[i], s = getS(w);
    var known = s.status === 'known', fav = s.fav;
    h.push('<div class="wcard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="wbody">');
    h.push('<div class="wword">' + esc(w.word) + '</div>');
    h.push('<div class="wmean">' + esc(w.meaning) + '</div>');
    h.push('</div>');
    h.push('<div class="wacts">');
    h.push('<button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (fav ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleFav(this)">' + (fav ? '★' : '☆') + '</button>');
    h.push('</div>');
    h.push('</div>');
  }
  document.getElementById('wlist').innerHTML = h.join('');
  window._wlist = list;
  updateStat();
}
function toggleKnown(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  setS(w, 'status', getS(w).status === 'known' ? '' : 'known');
  renderList();
}
function toggleFav(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  setS(w, 'fav', !getS(w).fav);
  renderList();
}
function updateStat() {
  var pool = wordsForRange(wri), kn = 0;
  for (var i = 0; i < pool.length; i++) if (getS(pool[i]).status === 'known') kn++;
  document.getElementById('wstat').textContent = '알아요 ' + kn + ' / ' + pool.length;
}

/* ---------- tab 2: flashcard ---------- */
var fri = 1, fcPool = [], fcIdx = 0, fcFlipped = false, fcTX = 0;
function setFCR(el) { fri = parseInt(el.getAttribute('data-i'), 10); fcIdx = 0; fcInit(); }
var fcEvReg = false;
function fcRegisterEvents() {
  if (fcEvReg) return;
  fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e) {
    if (e.target.id === 'fcfavbtn') return;
    fcFlip();
  });
  card.addEventListener('touchstart', function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
  document.getElementById('fcfavbtn').addEventListener('click', function(e) {
    e.stopPropagation();
    if (!fcPool.length) return;
    var w = fcPool[fcIdx];
    setS(w, 'fav', !getS(w).fav);
    fcFavUpdate();
  });
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  fcPool = wordsForRange(fri);
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function fcFavUpdate() {
  var b = document.getElementById('fcfavbtn');
  var fav = fcPool.length ? getS(fcPool[fcIdx]).fav : false;
  b.textContent = fav ? '★' : '☆';
  b.className = 'fcfav' + (fav ? ' on' : '');
}
function fcShow() {
  if (!fcPool.length) return;
  fcFlipped = false;
  var w = fcPool[fcIdx];
  document.getElementById('fcword').textContent = w.word;
  document.getElementById('fcmean').textContent = w.meaning;
  document.getElementById('fcmean').style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  document.getElementById('fcprog').style.width = ((fcIdx+1) / fcPool.length * 100) + '%';
  fcFavUpdate();
}
function fcFlip() {
  if (fcFlipped) return;
  if (!fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcmean').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].word);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }

/* ---------- tab 3: test (4지선다) ---------- */
var tri = 1, tName = '', tQs = [], tIdx = 0, tCorrect = 0, tResults = [], tLocked = false, tCurOpts = [];
var TCOUNT = 50;
function setTR(el) { tri = parseInt(el.getAttribute('data-i'), 10); renderRangeBar('trbar', tri, 'setTR'); }
function tSetup() {
  var p = document.getElementById('tpane');
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="ttitle">📝 단어 테스트</div>');
  h.push('<div class="tsub">영어 단어를 보고 알맞은 뜻을 고르세요 (4지선다)</div>');
  h.push('<label class="tlabel">이름</label>');
  h.push('<input id="tname" class="tinput" type="text" placeholder="이름을 입력하세요" autocomplete="off">');
  h.push('<label class="tlabel">문제 수</label>');
  h.push('<div class="tcnt"><button class="cbtn on">50문제</button></div>');
  h.push('<label class="tlabel">범위 선택</label>');
  h.push('<div class="rbar" id="trbar"></div>');
  h.push('<button class="pbtn" onclick="tStart()">테스트 시작 →</button>');
  h.push('</div>');
  p.innerHTML = h.join('');
  document.getElementById('tname').value = tName;
  renderRangeBar('trbar', tri, 'setTR');
}
function tStart() {
  var n = document.getElementById('tname').value.replace(/^\s+|\s+$/g, '');
  if (!n) { alert('이름을 입력해 주세요.'); document.getElementById('tname').focus(); return; }
  tName = n;
  tQs = shuffle(wordsForRange(tri)).slice(0, TCOUNT);
  tIdx = 0; tCorrect = 0; tResults = [];
  tShowQ();
}
function tMakeOpts(w) {
  var opts = [w.meaning];
  var used = {};
  used[w.meaning] = true;
  var guard = 0;
  while (opts.length < 4 && guard < 500) {
    guard++;
    var c = rawWords[Math.floor(Math.random() * rawWords.length)];
    if (used[c.meaning]) continue;
    used[c.meaning] = true;
    opts.push(c.meaning);
  }
  return shuffle(opts);
}
function tShowQ() {
  tLocked = false;
  var w = tQs[tIdx];
  tCurOpts = tMakeOpts(w);
  var p = document.getElementById('tpane');
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="tprogw"><div class="tprog" style="width:' + ((tIdx) / tQs.length * 100) + '%"></div></div>');
  h.push('<div class="tmeta"><span>' + (tIdx + 1) + ' / ' + tQs.length + '</span><span class="tok">✔ ' + tCorrect + '</span></div>');
  h.push('<div class="tq">');
  h.push('<div class="tqword">' + esc(w.word) + '</div>');
  h.push('<button class="tspk" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊 발음 듣기</button>');
  h.push('</div>');
  h.push('<div id="toptions">');
  for (var i = 0; i < tCurOpts.length; i++) {
    h.push('<button class="topt" data-oi="' + i + '"><span class="tnum">' + (i + 1) + '</span><span class="ttxt">' + esc(tCurOpts[i]) + '</span></button>');
  }
  h.push('</div>');
  h.push('<button id="t-next-btn" class="pbtn" style="display:none;" onclick="tNext()">' + (tIdx === tQs.length - 1 ? '결과 보기 →' : '다음 →') + '</button>');
  h.push('</div>');
  p.innerHTML = h.join('');
  var bs = document.querySelectorAll('#toptions .topt');
  for (var k = 0; k < bs.length; k++) {
    (function(b) {
      b.addEventListener('click', function() {
        var oi = parseInt(b.getAttribute('data-oi'), 10);
        tAnswer(b, tCurOpts[oi], tQs[tIdx].meaning);
      });
    })(bs[k]);
  }
  speak(w.word);
}
function tAnswer(el, chosen, correct) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll('#toptions .topt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    var oi = parseInt(b.getAttribute('data-oi'), 10);
    if (tCurOpts[oi] === correct) b.className += ' correct';
    else if (b === el) b.className += ' wrong';
    b.style.pointerEvents = 'none';
  }
  var ok = (chosen === correct);
  if (ok) tCorrect++;
  tResults.push({word: tQs[tIdx].word, meaning: correct, ans: chosen, ok: ok});
  var okEl = document.querySelector('.tok');
  if (okEl) okEl.textContent = '✔ ' + tCorrect;
  document.getElementById('t-next-btn').style.display = 'block';
}
function tNext() {
  tIdx++;
  if (tIdx >= tQs.length) { tShowResult(); return; }
  tShowQ();
  window.scrollTo(0, 0);
}
function tShowResult() {
  var tot = tQs.length;
  var pct = tot ? Math.round(tCorrect / tot * 100) : 0;
  var emo = pct === 100 ? '🏆' : (pct >= 80 ? '🎉' : (pct >= 60 ? '👍' : '💪'));
  var wrong = [];
  for (var i = 0; i < tResults.length; i++) if (!tResults[i].ok) wrong.push(tResults[i]);
  var p = document.getElementById('tpane');
  var h = [];
  h.push('<div class="tbox tres">');
  h.push('<div class="remo">' + emo + '</div>');
  h.push('<div class="rname">' + esc(tName) + ' · ' + esc(RANGES[tri].label) + '</div>');
  h.push('<div class="rscore">' + tCorrect + ' / ' + tot + '</div>');
  h.push('<div class="rpct">' + pct + '점</div>');
  if (wrong.length) {
    h.push('<div class="rwtitle">❌ 틀린 단어 (' + wrong.length + '개)</div>');
    h.push('<div class="rwlist">');
    for (var j = 0; j < wrong.length; j++) {
      var r = wrong[j];
      h.push('<div class="rwitem">');
      h.push('<div class="rww">' + esc(r.word) + '</div>');
      h.push('<div class="rwa">입력: <span class="bad">' + esc(r.ans) + '</span></div>');
      h.push('<div class="rwa">정답: <span class="good">' + esc(r.meaning) + '</span></div>');
      h.push('</div>');
    }
    h.push('</div>');
  } else {
    h.push('<div class="rperfect">모두 맞혔어요! 완벽해요 👏</div>');
  }
  h.push('<button class="pbtn kakao" onclick="tCopy()">📋 카톡으로 결과 복사</button>');
  h.push('<button class="pbtn sec" onclick="tSetup()">↩ 다시 테스트</button>');
  h.push('</div>');
  p.innerHTML = h.join('');
  window.scrollTo(0, 0);
}
function tCopyText() {
  var d = new Date();
  var ds = d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  var tot = tQs.length;
  var pct = tot ? Math.round(tCorrect / tot * 100) : 0;
  var L = [];
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) { if (tResults[i].ok) right.push(tResults[i].word); else wrong.push(tResults[i]); }
  L.push('[씨유에탑 ' + SERIES + '] 테스트 결과');
  L.push('날짜: ' + ds);
  L.push('이름: ' + tName);
  L.push('범위: ' + RANGES[tri].label);
  L.push('점수: ' + tCorrect + '/' + tot + ' (' + pct + '점)');
  L.push('─────────────────');
  L.push('❌ 틀린 단어 (' + wrong.length + '개)');
  for (var j = 0; j < wrong.length; j++) L.push('  ' + wrong[j].word + ' → 입력:' + wrong[j].ans + ' / 정답:' + wrong[j].meaning);
  L.push('─────────────────');
  L.push('✅ 맞은 단어: ' + right.join(', '));
  return L.join('\n');
}
function tCopy() {
  var txt = tCopyText();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert('결과가 복사되었어요! 카톡에 붙여넣기 하세요.'); }
    catch (e) { alert('복사에 실패했어요.'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() { alert('결과가 복사되었어요! 카톡에 붙여넣기 하세요.'); }, fallback);
  } else { fallback(); }
}

/* ---------- tabs ---------- */
var TABS = ['w','fc','t'];
function showTab(id) {
  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];
    document.getElementById('pane-' + t).classList.toggle('on', t === id);
    document.getElementById('tb-' + t).classList.toggle('on', t === id);
  }
  if (id === 'w')  { renderRangeBar('wrbar', wri, 'setWR'); renderList(); }
  if (id === 'fc') { fcInit(); }
  if (id === 't')  { tSetup(); }
  window.scrollTo(0, 0);
}
showTab('w');
</script>
