<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --success: #10B981;
  --success-dark: #047857;
  --danger: #EF4444;
  --warn: #F59E0B;
  --gray: #6B7280;
  --border: #E5E7EB;
  --bg: #F9FAFB;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: #111827; max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.jp { font-family: 'Noto Sans JP', 'Noto Sans KR', sans-serif; }
header { background: var(--primary); color: #fff; padding: 14px 16px 10px; text-align: center; flex-shrink: 0; }
header .htop { font-family: 'Nunito', 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 1px; opacity: 0.9; }
header .hsub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--gray); cursor: pointer; border: none; background: none; font-family: 'Noto Sans KR', sans-serif; }
.tab.on { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
.pane { display: none; flex: 1; overflow-y: auto; padding: 12px; flex-direction: column; }
.pane.on { display: flex; }
.rbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px 0; margin-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 0; }
.rbar::-webkit-scrollbar { display: none; }
.rbtn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Nunito', 'Noto Sans KR', sans-serif; }
.rbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.search-wrap { display: flex; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
.search-wrap input { flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; outline: none; }
.search-wrap input:focus { border-color: var(--primary); }
.filter-row { display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0; flex-wrap: wrap; }
.fbtn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; }
.fbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.fbtn.hide.on { background: #374151; border-color: #374151; }
/* Tab 1 */
#slist { display: flex; flex-direction: column; gap: 8px; }
.scard { display: flex; align-items: flex-start; background: #fff; border-radius: 12px; padding: 12px 10px 12px 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); gap: 6px; transition: opacity 0.2s; }
.scard.known { opacity: 0.35; }
.chk { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); background: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray); margin-top: 2px; }
.chk.on { background: var(--success); border-color: var(--success); color: #fff; }
.sbody { flex: 1; min-width: 0; }
.smeta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.snum { font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800; color: var(--gray); }
.scat { font-size: 10px; font-weight: 700; color: var(--primary-dark); background: var(--primary-light); border-radius: 6px; padding: 1px 6px; }
.sjp { font-size: 17px; font-weight: 700; color: #111; line-height: 1.4; word-break: keep-all; }
.skana { font-size: 12px; color: var(--gray); margin-top: 2px; }
.spron { font-size: 14px; color: var(--success-dark); font-weight: 700; margin-top: 4px; }
.smean { font-size: 13px; color: #374151; margin-top: 4px; }
.smean.hid { color: transparent; background: #E5E7EB; border-radius: 6px; cursor: pointer; user-select: none; }
.smean.hid::after { content: '탭하여 뜻 보기'; color: var(--gray); font-size: 11px; margin-left: -4.5em; }
.sacts { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.ibtn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border); background: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.favbtn.on { color: var(--warn); border-color: var(--warn); background: #fffbeb; }
.empty { text-align: center; color: var(--gray); font-size: 13px; padding: 30px 0; }
/* Tab 2 */
.fc-wrap { display: flex; flex-direction: column; }
.modebar { display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0; }
.modebar .fbtn { flex: 1; text-align: center; }
#fccard { background: #fff; border-radius: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; padding: 36px 20px 24px; margin-bottom: 12px; user-select: none; flex-shrink: 0; text-align: center; }
#fcctr { position: absolute; top: 12px; right: 14px; font-family: 'Nunito', sans-serif; font-size: 12px; color: var(--gray); font-weight: 700; }
#fccat { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); }
#fcfavbtn { position: absolute; top: 10px; left: 12px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray); }
#fcfavbtn.on { color: var(--warn); }
.fc-jp { font-size: 24px; font-weight: 800; color: #111; line-height: 1.4; word-break: keep-all; }
.fc-kana { font-size: 13px; color: var(--gray); margin-top: 6px; }
.fc-pron { font-size: 18px; color: var(--success-dark); font-weight: 700; margin-top: 10px; }
.fc-mean { font-size: 18px; color: var(--primary); font-weight: 700; margin-top: 14px; }
.fc-mean.big { font-size: 22px; color: #111; margin-top: 0; }
.fc-ans { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); width: 100%; }
#fctap { font-size: 12px; color: var(--gray); margin-top: 16px; }
.fcnav { display: flex; gap: 8px; flex-shrink: 0; }
.fcbtn { flex: 1; padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.fcbtn.sec { background: var(--border); color: #374151; }
.fcopt { display: flex; gap: 6px; margin-top: 10px; }
.fcopt .fbtn { flex: 1; text-align: center; }
/* Tab 3 */
.qopts { display: flex; flex-direction: column; gap: 8px; }
.qopt { padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; text-align: left; font-family: 'Noto Sans KR', sans-serif; line-height: 1.45; }
.qopt .qp { display: block; font-size: 12px; color: var(--success-dark); font-weight: 600; margin-top: 2px; }
.qopt.correct { background: #dcfce7; border-color: var(--success); color: #065f46; }
.qopt.wrong { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
#tsetup, #trun, #tres { display: none; flex-direction: column; gap: 10px; }
#tsetup.on, #trun.on, #tres.on { display: flex; }
.tcard { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.tlabel { font-size: 12px; font-weight: 700; color: var(--gray); margin-bottom: 6px; }
.tinput { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; outline: none; }
.tinput:focus { border-color: var(--primary); }
.tstart-btn { padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.tprog-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.tprog-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }
.tprog-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--gray); font-family: 'Nunito', sans-serif; font-weight: 700; margin-bottom: 12px; }
.tq { text-align: center; margin: 10px 0 16px; }
.tq .fc-jp { font-size: 21px; }
.tansbtn { padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; margin-top: 8px; }
.twrong-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.twrong-item { background: #fee2e2; border-radius: 10px; padding: 8px 12px; font-size: 12px; line-height: 1.6; }
.twrong-jp { font-weight: 700; font-size: 13px; }
.tcopy-btn { padding: 12px; border-radius: 12px; border: none; background: #25D366; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.tretry-btn { padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
.tres-score { font-family: 'Nunito', sans-serif; font-size: 40px; font-weight: 800; color: var(--primary); text-align: center; }
.tres-pct { font-size: 14px; color: var(--gray); text-align: center; margin-top: 4px; }
.tcorrect-list { font-size: 12px; color: #065f46; background: #dcfce7; border-radius: 10px; padding: 10px 12px; line-height: 1.8; }

</head>
<body>
<header>
  <div class="htop">씨유에탑 ✦ 일본어 회화</div>
  <div class="hsub" id="hsub"></div>
</header>
<div class="tabs">
  <button class="tab on" id="tb-s" onclick="showTab('s')">📚 문장</button>
  <button class="tab" id="tb-fc" onclick="showTab('fc')">🃏 암기카드</button>
  <button class="tab" id="tb-t" onclick="showTab('t')">📝 테스트</button>
</div>

<!-- Tab 1: 문장 목록 -->
<div class="pane on" id="pane-s">
  <div class="rbar" id="srbar"></div>
  <div class="search-wrap">
    <input type="text" id="ssearch" placeholder="일본어·발음·뜻 검색..." oninput="renderList()">
  </div>
  <div class="filter-row">
    <button class="fbtn on" id="flt-all" onclick="setFilter('all')">전체</button>
    <button class="fbtn" id="flt-unk" onclick="setFilter('unk')">모름</button>
    <button class="fbtn" id="flt-fav" onclick="setFilter('fav')">⭐즐겨찾기</button>
    <button class="fbtn hide" id="flt-hide" onclick="toggleHide()">🙈 뜻 가리기</button>
  </div>
  <div id="slist"></div>
</div>

<!-- Tab 2: 암기카드 -->
<div class="pane" id="pane-fc">
  <div class="rbar" id="fcrbar"></div>
  <div class="modebar">
    <button class="fbtn on" id="fcm-jk" onclick="setFcMode('jk')">일본어 → 뜻</button>
    <button class="fbtn" id="fcm-kj" onclick="setFcMode('kj')">뜻 → 일본어</button>
  </div>
  <div class="fc-wrap">
    <div id="fccard">
      <button id="fcfavbtn" onclick="fcToggleFav(event)">☆</button>
      <span id="fccat" class="scat"></span>
      <span id="fcctr"></span>
      <div id="fcfront"></div>
      <div id="fcback" class="fc-ans" style="display:none;"></div>
      <div id="fctap">탭하여 정답 보기</div>
    </div>
    <div class="fcnav">
      <button class="fcbtn sec" onclick="fcPrev()">◀ 이전</button>
      <button class="fcbtn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
      <button class="fcbtn" onclick="fcNext()">다음 ▶</button>
    </div>
    <div class="fcopt">
      <button class="fbtn" id="fc-shuf" onclick="fcShuffle()">🔀 섞기</button>
      <button class="fbtn" id="fc-slow" onclick="toggleSlow()">🐢 천천히</button>
      <button class="fbtn" id="fc-unk" onclick="fcToggleUnk()">모름만</button>
    </div>
  </div>
</div>

<!-- Tab 3: 테스트 -->
<div class="pane" id="pane-t">
  <div id="tsetup" class="on">
    <div class="tcard">
      <div class="tlabel">이름</div>
      <input class="tinput" type="text" id="tname" placeholder="이름을 입력하세요">
    </div>
    <div class="tcard">
      <div class="tlabel">문제 유형</div>
      <div class="filter-row" style="margin:0;">
        <button class="fbtn on" id="tm-jk" onclick="setTMode('jk')">일본어 보고 뜻 고르기</button>
        <button class="fbtn" id="tm-kj" onclick="setTMode('kj')">뜻 보고 일본어 고르기</button>
      </div>
    </div>
    <div class="tcard">
      <div class="tlabel">문제 수 (최대 50)</div>
      <input class="tinput" type="number" id="tcount" value="20" min="1" max="50">
    </div>
    <div class="tcard">
      <div class="tlabel">범위 (20문장씩)</div>
      <div class="rbar" id="trbar" style="margin-bottom:0;"></div>
    </div>
    <button class="tstart-btn" onclick="tStart()">테스트 시작 ▶</button>
  </div>
  <div id="trun">
    <div class="tprog-bar"><div class="tprog-fill" id="tpfill"></div></div>
    <div class="tprog-info"><span id="tpnum"></span><span id="tpcor"></span></div>
    <div class="tcard">
      <div class="tq" id="tq"></div>
      <div class="qopts" id="topts"></div>
      <button class="tansbtn" id="tnext" onclick="tNext()" style="width:100%; display:none;">다음 →</button>
    </div>
  </div>
  <div id="tres">
    <div class="tcard" style="text-align:center;">
      <div id="testemoji" style="font-size:48px; margin-bottom:6px;"></div>
      <div class="tres-score" id="tresscore"></div>
      <div class="tres-pct" id="trespct"></div>
    </div>
    <div class="tcard" id="twrongcard" style="display:none;">
      <div class="tlabel">❌ 틀린 문장</div>
      <div class="twrong-list" id="twronglist"></div>
    </div>
    <div class="tcard" id="tcorcard" style="display:none;">
      <div class="tlabel">✅ 맞은 문장</div>
      <div class="tcorrect-list" id="tcorlist"></div>
    </div>
    <button class="tcopy-btn" onclick="tCopy()">📋 카톡으로 결과 복사</button>
    <button class="tretry-btn" onclick="tRetry()">↩ 다시 테스트</button>
  </div>
</div>

// cat, jp(일본어), kana(읽기), pron(한글 발음), mean(뜻)
var items = rawData.map(function(r, i){ return {no: PART.start + i, cat:r[0], jp:r[1], kana:r[2], pron:r[3], mean:r[4]}; });

document.getElementById('hsub').textContent = PART.title + ' · ' + PART.start + '~' + (PART.start + items.length - 1) + ' (' + items.length + '문장)';

var STORE_KEY = 'cutop_jp_conv_part' + PART.no;
var store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { store = {}; }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e) {} }
function getS(it) { var k = it.jp; if (!store[k]) store[k] = {status:'', fav:false}; return store[k]; }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ===== 음성 =====
var slow = false;
var jaVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  var vs = window.speechSynthesis.getVoices();
  for (var i = 0; i < vs.length; i++) { if (/^ja/i.test(vs[i].lang)) { jaVoice = vs[i]; break; } }
}
if ('speechSynthesis' in window) { pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = slow ? 0.6 : 0.85;
  window.speechSynthesis.speak(u);
}
function speakIdx(i) { speak(items[i].jp); }

// ===== 범위 (20문장씩) =====
var RANGES = (function(){
  var r = [{label:'전체', s:0, e:items.length}];
  for (var i = 0; i < items.length; i += 20) {
    var e = Math.min(i + 20, items.length);
    r.push({label:(PART.start+i)+'~'+(PART.start+e-1), s:i, e:e});
  }
  return r;
})();
function renderRangeBar(barId, ri, fn) {
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    h.push('<button class="rbtn' + (i === ri ? ' on' : '') + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  document.getElementById(barId).innerHTML = h.join('');
}
function itemsForRange(ri) { var r = RANGES[ri]; return items.slice(r.s, r.e); }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// ===== Tab 1 =====
var sri = 0, sFilter = 'all', hideMean = false;
function setSR(btn) { sri = parseInt(btn.dataset.i); renderList(); }
function setFilter(f) {
  sFilter = f;
  ['all','unk','fav'].forEach(function(k){ document.getElementById('flt-' + k).classList.toggle('on', k === f); });
  renderList();
}
function toggleHide() { hideMean = !hideMean; document.getElementById('flt-hide').classList.toggle('on', hideMean); renderList(); }
function renderList() {
  renderRangeBar('srbar', sri, 'setSR');
  var pool = itemsForRange(sri);
  var q = document.getElementById('ssearch').value.replace(/\s/g,'');
  var list = [];
  for (var i = 0; i < pool.length; i++) {
    var it = pool[i], s = getS(it);
    if (sFilter === 'unk' && s.status === 'known') continue;
    if (sFilter === 'fav' && !s.fav) continue;
    if (q && (it.jp + it.kana + it.pron + it.mean + it.cat).replace(/\s/g,'').indexOf(q) < 0) continue;
    list.push(it);
  }
  var h = [];
  for (var i = 0; i < list.length; i++) {
    var it = list[i], s = getS(it), known = s.status === 'known';
    h.push('<div class="scard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-li="' + i + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="sbody">');
    h.push('<div class="smeta"><span class="snum">' + it.no + '</span><span class="scat">' + esc(it.cat) + '</span></div>');
    h.push('<div class="sjp jp">' + esc(it.jp) + '</div>');
    if (it.kana.replace(/[、。\s]/g,'') !== it.jp.replace(/[、。\s]/g,'')) h.push('<div class="skana jp">' + esc(it.kana) + '</div>');
    h.push('<div class="spron">' + esc(it.pron) + '</div>');
    h.push('<div class="smean' + (hideMean ? ' hid' : '') + '" onclick="this.classList.remove(\'hid\')">' + esc(it.mean) + '</div>');
    h.push('</div>');
    h.push('<div class="sacts">');
    h.push('<button class="ibtn" data-li="' + i + '" onclick="speak(window._slist[this.dataset.li].jp)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (s.fav ? ' on' : '') + '" data-li="' + i + '" onclick="toggleFav(this)">' + (s.fav ? '★' : '☆') + '</button>');
    h.push('</div></div>');
  }
  document.getElementById('slist').innerHTML = list.length ? h.join('') : '<div class="empty">표시할 문장이 없습니다.</div>';
  window._slist = list;
}
function toggleKnown(btn) { var s = getS(window._slist[parseInt(btn.dataset.li)]); s.status = s.status === 'known' ? '' : 'known'; save(); renderList(); }
function toggleFav(btn) { var s = getS(window._slist[parseInt(btn.dataset.li)]); s.fav = !s.fav; save(); renderList(); }

// ===== Tab 2: 암기카드 =====
var fri = 0, fcMode = 'jk', fcPool = [], fcIdx = 0, fcFlipped = false, fcTX = 0, fcEvReg = false, fcUnkOnly = false, fcShuffled = false;
function setFCR(btn) { fri = parseInt(btn.dataset.i); fcIdx = 0; fcShuffled = false; document.getElementById('fc-shuf').classList.remove('on'); fcInit(); }
function setFcMode(m) {
  fcMode = m;
  document.getElementById('fcm-jk').classList.toggle('on', m === 'jk');
  document.getElementById('fcm-kj').classList.toggle('on', m === 'kj');
  fcShow();
}
function toggleSlow() { slow = !slow; document.getElementById('fc-slow').classList.toggle('on', slow); }
function fcShuffle() {
  fcShuffled = !fcShuffled;
  document.getElementById('fc-shuf').classList.toggle('on', fcShuffled);
  fcIdx = 0; fcInit();
}
function fcToggleUnk() { fcUnkOnly = !fcUnkOnly; document.getElementById('fc-unk').classList.toggle('on', fcUnkOnly); fcIdx = 0; fcInit(); }
function fcRegisterEvents() {
  if (fcEvReg) return; fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e){ if (e.target.id === 'fcfavbtn') return; fcFlip(); });
  card.addEventListener('touchstart', function(e){ fcTX = e.touches[0].clientX; }, {passive:true});
  card.addEventListener('touchend', function(e){ var dx = e.changedTouches[0].clientX - fcTX; if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); } }, {passive:true});
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  var base = itemsForRange(fri);
  if (fcUnkOnly) base = base.filter(function(it){ return getS(it).status !== 'known'; });
  fcPool = fcShuffled ? shuffle(base) : base;
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function jpBlock(it) {
  var h = '<div class="fc-jp jp">' + esc(it.jp) + '</div>';
  if (it.kana.replace(/[、。\s]/g,'') !== it.jp.replace(/[、。\s]/g,'')) h += '<div class="fc-kana jp">' + esc(it.kana) + '</div>';
  h += '<div class="fc-pron">' + esc(it.pron) + '</div>';
  return h;
}
function fcShow() {
  var front = document.getElementById('fcfront'), back = document.getElementById('fcback');
  if (!fcPool.length) {
    front.innerHTML = '<div class="empty">표시할 문장이 없습니다.</div>'; back.style.display = 'none';
    document.getElementById('fcctr').textContent = ''; document.getElementById('fccat').textContent = ''; document.getElementById('fctap').style.display = 'none';
    return;
  }
  fcFlipped = false;
  var it = fcPool[fcIdx];
  if (fcMode === 'jk') { front.innerHTML = jpBlock(it); back.innerHTML = '<div class="fc-mean">' + esc(it.mean) + '</div>'; }
  else { front.innerHTML = '<div class="fc-mean big">' + esc(it.mean) + '</div>'; back.innerHTML = jpBlock(it); }
  back.style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fctap').textContent = fcMode === 'jk' ? '탭하여 발음 듣기 · 뜻 보기' : '일본어로 말해 본 뒤 탭하세요';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  document.getElementById('fccat').textContent = it.cat;
  var s = getS(it), fb = document.getElementById('fcfavbtn');
  fb.textContent = s.fav ? '★' : '☆'; fb.className = s.fav ? 'on' : '';
}
function fcFlip() {
  if (fcFlipped || !fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcback').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].jp);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }
function speakFc() { if (fcPool.length) speak(fcPool[fcIdx].jp); }
function fcToggleFav(e) {
  if (e) e.stopPropagation();
  if (!fcPool.length) return;
  var s = getS(fcPool[fcIdx]); s.fav = !s.fav; save();
  var fb = document.getElementById('fcfavbtn'); fb.textContent = s.fav ? '★' : '☆'; fb.className = s.fav ? 'on' : '';
}

// ===== Tab 3: 테스트 =====
var tri = 0, tMode = 'jk', tPool = [], tIdx = 0, tCorCount = 0, tResults = [], tName = '', tTotal = 0, tLocked = false, tOpts = [];
function setTR(btn) { tri = parseInt(btn.dataset.i); renderRangeBar('trbar', tri, 'setTR'); }
function setTMode(m) { tMode = m; document.getElementById('tm-jk').classList.toggle('on', m === 'jk'); document.getElementById('tm-kj').classList.toggle('on', m === 'kj'); }
function tSetup() {
  if (tri === 0 && RANGES.length > 1) tri = 1;
  renderRangeBar('trbar', tri, 'setTR');
  document.getElementById('tsetup').className = 'on';
  document.getElementById('trun').className = '';
  document.getElementById('tres').className = '';
}
function tStart() {
  var name = document.getElementById('tname').value.trim();
  if (!name) { alert('이름을 입력해 주세요.'); return; }
  var cnt = parseInt(document.getElementById('tcount').value) || 20;
  cnt = Math.max(1, Math.min(50, cnt));
  tName = name;
  tPool = shuffle(itemsForRange(tri)).slice(0, cnt);
  tTotal = tPool.length; tIdx = 0; tCorCount = 0; tResults = [];
  document.getElementById('tsetup').className = '';
  document.getElementById('trun').className = 'on';
  tShowQ();
}
function tShowQ() {
  if (tIdx >= tPool.length) { tShowResult(); return; }
  var it = tPool[tIdx];
  tLocked = false;
  document.getElementById('tpfill').style.width = Math.round(tIdx / tTotal * 100) + '%';
  document.getElementById('tpnum').textContent = (tIdx+1) + ' / ' + tTotal;
  document.getElementById('tpcor').textContent = '✅ ' + tCorCount;
  // 같은 범위에서 먼저 오답을 고르고, 모자라면 전체에서
  var near = shuffle(itemsForRange(tri).filter(function(x){ return x.mean !== it.mean && x.jp !== it.jp; }));
  var far = shuffle(items.filter(function(x){ return x.mean !== it.mean && x.jp !== it.jp; }));
  var opts = [it];
  [near, far].forEach(function(src){ for (var j = 0; j < src.length && opts.length < 4; j++) { if (opts.indexOf(src[j]) < 0 && !opts.some(function(o){ return o.mean === src[j].mean; })) opts.push(src[j]); } });
  tOpts = shuffle(opts);
  var q = document.getElementById('tq'), h = [];
  if (tMode === 'jk') { q.innerHTML = jpBlock(it); speak(it.jp); }
  else { q.innerHTML = '<div class="fc-mean big">' + esc(it.mean) + '</div>'; }
  for (var k = 0; k < tOpts.length; k++) {
    var o = tOpts[k], label = tMode === 'jk' ? esc(o.mean) : '<span class="jp">' + esc(o.jp) + '</span><span class="qp">' + esc(o.pron) + '</span>';
    h.push('<button class="qopt" data-k="' + k + '" data-cor="' + (o === it ? '1' : '0') + '" onclick="tPick(this)">' + label + '</button>');
  }
  document.getElementById('topts').innerHTML = h.join('');
  document.getElementById('tnext').style.display = 'none';
}
function tPick(btn) {
  if (tLocked) return; tLocked = true;
  var it = tPool[tIdx], cor = btn.dataset.cor === '1';
  var opts = document.getElementById('topts').querySelectorAll('.qopt');
  for (var i = 0; i < opts.length; i++) { opts[i].style.pointerEvents = 'none'; if (opts[i].dataset.cor === '1') opts[i].className = 'qopt correct'; }
  if (!cor) btn.className = 'qopt wrong'; else tCorCount++;
  document.getElementById('tpcor').textContent = '✅ ' + tCorCount;
  var picked = tOpts[parseInt(btn.dataset.k)];
  tResults.push({it: it, ans: tMode === 'jk' ? picked.mean : picked.jp, ok: cor});
  if (tMode === 'kj') speak(it.jp);
  var nb = document.getElementById('tnext');
  nb.textContent = (tIdx + 1 >= tTotal) ? '결과 보기 →' : '다음 →';
  nb.style.display = 'block';
}
function tNext() { if (!tLocked) return; tIdx++; if (tIdx >= tPool.length) document.getElementById('tpfill').style.width = '100%'; tShowQ(); }
function tShowResult() {
  document.getElementById('trun').className = '';
  document.getElementById('tres').className = 'on';
  var pct = Math.round(tCorCount / tTotal * 100);
  document.getElementById('testemoji').textContent = pct === 100 ? '🏆' : pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '💪';
  document.getElementById('tresscore').textContent = tCorCount + ' / ' + tTotal;
  document.getElementById('trespct').textContent = pct + '점';
  var wrong = tResults.filter(function(r){ return !r.ok; }), corr = tResults.filter(function(r){ return r.ok; });
  var wcard = document.getElementById('twrongcard'), ccard = document.getElementById('tcorcard');
  if (wrong.length) {
    wcard.style.display = 'block';
    document.getElementById('twronglist').innerHTML = wrong.map(function(r){
      return '<div class="twrong-item"><div class="twrong-jp jp">' + r.it.no + '. ' + esc(r.it.jp) + '</div><div style="color:#047857;font-weight:600;">' + esc(r.it.pron) + '</div>' +
        '<div>정답: <b>' + esc(r.it.mean) + '</b></div><div style="color:#991b1b;">선택: ' + esc(r.ans) + '</div></div>';
    }).join('');
  } else wcard.style.display = 'none';
  if (corr.length) { ccard.style.display = 'block'; document.getElementById('tcorlist').textContent = corr.map(function(r){ return r.it.jp; }).join('  '); }
  else ccard.style.display = 'none';
}
function tCopy() {
  var now = new Date();
  var pct = Math.round(tCorCount / tTotal * 100);
  var wrong = tResults.filter(function(r){ return !r.ok; }), corr = tResults.filter(function(r){ return r.ok; });
  var lines = [];
  lines.push('[씨유에탑 일본어 회화 ' + PART.title + '] 테스트 결과');
  lines.push('날짜: ' + now.getFullYear() + '. ' + (now.getMonth()+1) + '. ' + now.getDate() + '.');
  lines.push('이름: ' + tName);
  lines.push('범위: ' + RANGES[tri].label + ' / 유형: ' + (tMode === 'jk' ? '일본어→뜻' : '뜻→일본어'));
  lines.push('점수: ' + tCorCount + '/' + tTotal + ' (' + pct + '점)');
  lines.push('─────────────────');
  lines.push('❌ 틀린 문장 (' + wrong.length + '개)');
  wrong.forEach(function(r){ lines.push('  ' + r.it.no + '. ' + r.it.jp + ' (' + r.it.pron + ') = ' + r.it.mean); });
  lines.push('─────────────────');
  lines.push('✅ 맞은 문장: ' + corr.length + '개');
  var text = lines.join('\n');
  function done(){ alert('클립보드에 복사되었습니다!'); }
  function fallback(){ var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(ta); done(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function tRetry() { document.getElementById('tres').className = ''; document.getElementById('tsetup').className = 'on'; }

// ===== 탭 전환 =====
var TABS = ['s','fc','t'];
function showTab(id) {
  TABS.forEach(function(t){ document.getElementById('pane-' + t).classList.toggle('on', t === id); document.getElementById('tb-' + t).classList.toggle('on', t === id); });
  if (id === 's') renderList();
  if (id === 'fc') fcInit();
  if (id === 't') tSetup();
}
renderList();
</script>
