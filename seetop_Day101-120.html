.pane { display: none; padding: 14px; flex: 1; }

.rbtn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Nunito', sans-serif; }
.rbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }

.search { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; outline: none; background: #fff; margin-bottom: 8px; }

.filters { display: flex; gap: 6px; margin-bottom: 8px; }

.fbtn.on { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.stat { font-size: 12px; color: var(--gray); margin-bottom: 8px; font-family: 'Nunito', 'Noto Sans KR', sans-serif; font-weight: 700; }

.wcard.known { opacity: 0.35; }
.chk { width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px; border: 2px solid var(--border); background: #fff; color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; }
.chk.on { background: var(--success); border-color: var(--success); }

.wmean { font-size: 14px; color: #374151; margin-top: 2px; word-break: keep-all; }
.wacts { display: flex; gap: 4px; flex-shrink: 0; }

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function speak(t) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() { speak(document.getElementById('fcword').textContent); }

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(function() { el.style.display = 'none'; }, 1800);
}

/* ---------- storage ---------- */
var store = {};
try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { store = {}; }
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
function skey(w) { return w.word + '|' + w.meaning; }
function getS(w) {
  var s = store[skey(w)];
  if (!s) return { status: '', fav: false };
  return { status: s.status || '', fav: !!s.fav };
}
function setS(w, s) { store[skey(w)] = { status: s.status, fav: s.fav }; saveStore(); }

/* ---------- ranges ---------- */
function buildRanges(ws) {
  var r = [{label:'전체', s:0, e:ws.length}];
  for (var i = 0; i < ws.length; i += 50) {
    var e = Math.min(i + 50, ws.length);
    r.push({label:(i+1)+'~'+e, s:i, e:e});
  }
  return r;
}
var RANGES = buildRanges(rawWords);

function renderRangeBar(barId, ri, fn) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    var cls = 'rbtn' + (i === ri ? ' on' : '');
    h.push('<button class="' + cls + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  bar.innerHTML = h.join('');
  var on = bar.querySelector('.rbtn.on');
  if (on && on.scrollIntoView) {
    var left = on.offsetLeft - bar.clientWidth / 2 + on.clientWidth / 2;
    bar.scrollLeft = left < 0 ? 0 : left;
  }
}

function wordsForRange(ri) {
  var r = RANGES[ri];
  return rawWords.slice(r.s, r.e);
}

/* ---------- tab 1: word list ---------- */
var wri = 0;
var wfilter = 'all';
function setWR(el) { wri = parseInt(el.getAttribute('data-i'), 10); renderList(); }
function setFilter(f) {
  wfilter = f;
  document.getElementById('flt-all').classList.toggle('on', f === 'all');
  document.getElementById('flt-unk').classList.toggle('on', f === 'unk');
  document.getElementById('flt-fav').classList.toggle('on', f === 'fav');
  renderList();
}
function renderList() {
  renderRangeBar('wrbar', wri, 'setWR');
  var pool = wordsForRange(wri);
  var q = document.getElementById('wsearch').value.replace(/^\s+|\s+$/g, '').toLowerCase();
  var list = [];
  var knownCnt = 0;
  for (var k = 0; k < pool.length; k++) {
    var pw = pool[k], ps = getS(pw);
    if (ps.status === 'known') knownCnt++;
    if (wfilter === 'unk' && ps.status === 'known') continue;
    if (wfilter === 'fav' && !ps.fav) continue;
    if (q && pw.word.toLowerCase().indexOf(q) < 0 && pw.meaning.toLowerCase().indexOf(q) < 0) continue;
    list.push(pw);
  }
  var h = [];
  for (var i = 0; i < list.length; i++) {
    var w = list[i], s = getS(w);
    var known = s.status === 'known', fav = s.fav;
    h.push('<div class="wcard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="wbody">');
    h.push('<div class="wword">' + esc(w.word) + '</div>');
    h.push('<div class="wmean">' + esc(w.meaning) + '</div>');
    h.push('</div>');
    h.push('<div class="wacts">');
    h.push('<button class="ibtn" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (fav ? ' on' : '') + '" data-wi="' + i + '" onclick="toggleFav(this)">' + (fav ? '★' : '☆') + '</button>');
    h.push('</div>');
    h.push('</div>');
  }
  if (!list.length) h.push('<div class="empty">표시할 단어가 없어요</div>');
  document.getElementById('wlist').innerHTML = h.join('');
  document.getElementById('wstat').textContent = '표시 ' + list.length + '개 · 알아요 ' + knownCnt + '/' + pool.length;
  window._wlist = list;
}
function toggleKnown(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  var s = getS(w);
  s.status = s.status === 'known' ? '' : 'known';
  setS(w, s);
  renderList();
}
function toggleFav(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  if (!w) return;
  var s = getS(w);
  s.fav = !s.fav;
  setS(w, s);
  renderList();
}

/* ---------- tab 2: flashcard ---------- */
var fri = 0, fcPool = [], fcIdx = 0, fcFlipped = false, fcTX = 0;
function setFCR(el) { fri = parseInt(el.getAttribute('data-i'), 10); fcIdx = 0; fcInit(); }
var fcEvReg = false;
function fcRegisterEvents() {
  if (fcEvReg) return;
  fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e) {
    if (e.target.id === 'fcfavbtn') return;
    fcFlip();
  });
  card.addEventListener('touchstart', function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  fcPool = wordsForRange(fri);
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function fcShow() {
  if (!fcPool.length) return;
  fcFlipped = false;
  var w = fcPool[fcIdx];
  document.getElementById('fcword').textContent = w.word;
  document.getElementById('fcmean').textContent = w.meaning;
  document.getElementById('fcmean').style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  document.getElementById('fcfavbtn').textContent = getS(w).fav ? '★' : '☆';
}
function fcFlip() {
  if (fcFlipped) return;
  if (!fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcmean').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].word);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }
function fcToggleFav() {
  if (!fcPool.length) return;
  var w = fcPool[fcIdx];
  var s = getS(w);
  s.fav = !s.fav;
  setS(w, s);
  document.getElementById('fcfavbtn').textContent = s.fav ? '★' : '☆';
}

var tri = 0, tName = '', tQs = [], tIdx = 0, tCorrect = 0, tResults = [], tLocked = false, tStarted = false;
var T_COUNT = 50;
function setTR(el) { tri = parseInt(el.getAttribute('data-i'), 10); renderRangeBar('trbar', tri, 'setTR'); }
function tSetup() {
  if (tStarted) return;
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="tlabel">이름</div>');
  h.push('<input class="tinput" id="tname" type="text" placeholder="이름을 입력하세요" value="' + esc(tName) + '">');
  h.push('<div class="tlabel">문제 수</div>');
  h.push('<div class="qcnt"><span class="qbtn">50문제</span></div>');
  h.push('<div class="tlabel">범위</div>');
  h.push('<div class="rbar" id="trbar"></div>');
  h.push('<button class="pbtn" onclick="tStart()">테스트 시작 ▶</button>');
  h.push('</div>');
  document.getElementById('tarea').innerHTML = h.join('');
  renderRangeBar('trbar', tri, 'setTR');
}
function tStart() {
  var nm = document.getElementById('tname').value.replace(/^\s+|\s+$/g, '');
  if (!nm) { alert('이름을 입력해 주세요.'); return; }
  tName = nm;
  var pool = shuffle(wordsForRange(tri));
  tQs = pool.slice(0, Math.min(T_COUNT, pool.length));
  tIdx = 0; tCorrect = 0; tResults = []; tStarted = true;
  tRenderQ();
}
function tBuildOptions(w) {
  var cands = shuffle(rawWords);
  var opts = [w.meaning];
  for (var i = 0; i < cands.length && opts.length < 4; i++) {
    var m = cands[i].meaning;
    if (opts.indexOf(m) < 0) opts.push(m);
  }
  return shuffle(opts);
}
function tRenderQ() {
  tLocked = false;
  var w = tQs[tIdx];
  var opts = tBuildOptions(w);
  var total = tQs.length;
  var h = [];
  h.push('<div class="ptrack"><div class="pfill" style="width:' + Math.round(tIdx / total * 100) + '%"></div></div>');
  h.push('<div class="tmeta"><span>' + (tIdx + 1) + ' / ' + total + '</span><span class="ok">✔ 맞춤 ' + tCorrect + '</span></div>');
  h.push('<div class="tq">');
  h.push('<div class="tqword">' + esc(w.word) + '</div>');
  h.push('<div class="tqpron">' + (w.pron ? esc(w.pron) : '') + '</div>');
  h.push('<button class="tqspk" data-w="' + esc(w.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
  h.push('</div>');
  h.push('<div id="toptions">');
  for (var i = 0; i < opts.length; i++) {
    h.push('<button class="topt" data-oi="' + i + '">' + esc(opts[i]) + '</button>');
  }
  h.push('</div>');
  h.push('<button class="pbtn" id="t-next-btn" onclick="tNext()">' + (tIdx === total - 1 ? '결과 보기 →' : '다음 →') + '</button>');
  document.getElementById('tarea').innerHTML = h.join('');
  var btns = document.querySelectorAll('#toptions .topt');
  for (var j = 0; j < btns.length; j++) {
    (function(b, val) {
      b.addEventListener('click', function() { tAnswer(b, val, w.meaning); });
    })(btns[j], opts[j]);
  }
  speak(w.word);
}
function tAnswer(el, chosen, correct) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll('#toptions .topt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    if (b.textContent.replace(/^\s+/, '') === correct) b.className += ' correct';
    else if (b === el) b.className += ' wrong';
    b.style.pointerEvents = 'none';
  }
  var ok = (chosen === correct);
  if (ok) tCorrect++;
  tResults.push({ word: tQs[tIdx].word, meaning: correct, ans: chosen, ok: ok });
  var meta = document.querySelector('.tmeta .ok');
  if (meta) meta.textContent = '✔ 맞춤 ' + tCorrect;
  document.getElementById('t-next-btn').style.display = 'block';
}
function tNext() {
  if (!tLocked) return;
  tIdx++;
  if (tIdx >= tQs.length) { tShowResult(); return; }
  tRenderQ();
}
function tEmoji(p) {
  if (p === 100) return '🏆';
  if (p >= 80) return '🎉';
  if (p >= 60) return '👍';
  return '💪';
}
function tShowResult() {
  var total = tQs.length;
  var pct = total ? Math.round(tCorrect / total * 100) : 0;
  var wrong = [];
  for (var i = 0; i < tResults.length; i++) if (!tResults[i].ok) wrong.push(tResults[i]);
  var h = [];
  h.push('<div class="tbox">');
  h.push('<div class="rscore">');
  h.push('<div class="remoji">' + tEmoji(pct) + '</div>');
  h.push('<div class="rnum">' + tCorrect + ' / ' + total + '</div>');
  h.push('<div class="rpct">' + pct + '점</div>');
  h.push('<div class="rname">' + esc(tName) + '</div>');
  h.push('</div>');
  if (wrong.length) {
    h.push('<div class="rsec">❌ 틀린 단어 (' + wrong.length + '개)</div>');
    for (var j = 0; j < wrong.length; j++) {
      var r = wrong[j];
      h.push('<div class="ritem">');
      h.push('<div class="rw">' + esc(r.word) + '</div>');
      h.push('<div class="ra">입력: ' + esc(r.ans) + '</div>');
      h.push('<div class="rc">정답: ' + esc(r.meaning) + '</div>');
      h.push('</div>');
    }
  } else {
    h.push('<div class="rsec" style="text-align:center;">모두 맞혔어요! 완벽해요 ✨</div>');
  }
  h.push('<button class="pbtn kbtn" onclick="tCopy()">📋 카톡으로 결과 복사</button>');
  h.push('<button class="pbtn sbtn" onclick="tRestart()">↩ 다시 테스트</button>');
  h.push('</div>');
  document.getElementById('tarea').innerHTML = h.join('');
}
function tBuildText() {
  var total = tQs.length;
  var pct = total ? Math.round(tCorrect / total * 100) : 0;
  var d = new Date();
  var lines = [];
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) right.push(tResults[i].word); else wrong.push(tResults[i]);
  }
  lines.push('[씨유에탑 ' + SERIES + '] 테스트 결과');
  lines.push('날짜: ' + d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.');
  lines.push('이름: ' + tName);
  lines.push('점수: ' + tCorrect + '/' + total + ' (' + pct + '점)');
  lines.push('─────────────────');
  lines.push('❌ 틀린 단어 (' + wrong.length + '개)');
  for (var j = 0; j < wrong.length; j++) {
    lines.push('  ' + wrong[j].word + ' → 입력:' + wrong[j].ans + ' / 정답:' + wrong[j].meaning);
  }
  lines.push('─────────────────');
  lines.push('✅ 맞은 단어: ' + right.join(', '));
  return lines.join('\n');
}
function tCopy() {
  var txt = tBuildText();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); toast('결과가 복사되었어요! 카톡에 붙여넣기 하세요'); }
    catch (e) { alert(txt); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      toast('결과가 복사되었어요! 카톡에 붙여넣기 하세요');
    }, fallback);
  } else {
    fallback();
  }
}
function tRestart() { tStarted = false; tSetup(); }

/* ---------- tabs ---------- */
var TABS = ['w','fc','t'];
function showTab(id) {
  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];
    document.getElementById('pane-' + t).classList.toggle('on', t === id);
    document.getElementById('tb-' + t).classList.toggle('on', t === id);
  }
  if (id === 'w')  { renderRangeBar('wrbar', wri, 'setWR'); renderList(); }
  if (id === 'fc') { fcInit(); }
  if (id === 't')  { tSetup(); }
}

document.getElementById('hsub').textContent = SERIES + ' · 총 ' + rawWords.length + '단어';
renderList();
</script>
</body>
</html>
