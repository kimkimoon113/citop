:root {

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: 'Noto Sans KR', sans-serif; background: #E5E7EB; color: #111827; }
button { font-family: inherit; }
.app { max-width: 420px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.hdr { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 16px 18px 14px; flex-shrink: 0; }
.hdr h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.hdr p { font-size: 12px; opacity: .85; margin-top: 3px; font-family: 'Nunito','Noto Sans KR',sans-serif; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; padding: 12px 0; border: none; background: none; font-size: 13px; font-weight: 700; color: var(--gray); border-bottom: 3px solid transparent; cursor: pointer; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); }
.pane { display: none; flex: 1; overflow: hidden; flex-direction: column; padding: 12px 14px 0; }
.pane.on { display: flex; }
#pane-t { overflow-y: auto; padding-bottom: 24px; }
.rbar { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px 0; margin-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 0; }
.rbar::-webkit-scrollbar { display: none; }
.rbtn { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; white-space: nowrap; font-family: 'Nunito', sans-serif; }
.rbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.search { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; font-family: inherit; flex-shrink: 0; background: #fff; }
.search:focus { border-color: var(--primary); }
.frow { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-shrink: 0; }
.fbtn { padding: 5px 12px; border-radius: 8px; border: none; background: #fff; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--gray); cursor: pointer; }
.fbtn.on { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.wcount { margin-left: auto; font-size: 12px; color: var(--gray); font-family: 'Nunito','Noto Sans KR',sans-serif; }
#wlist { flex: 1; overflow-y: auto; padding-bottom: 20px; -webkit-overflow-scrolling: touch; }
.wcard { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 10px; margin-bottom: 7px; transition: opacity .2s; }
.wcard.known { opacity: .35; }
.chk { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); background: #fff; color: #fff; font-size: 14px; font-weight: 800; flex-shrink: 0; cursor: pointer; }
.chk.on { background: var(--success); border-color: var(--success); }
.wbody { flex: 1; min-width: 0; }
.wword { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; word-break: break-word; }
.wmean { font-size: 13px; color: #374151; margin-top: 2px; word-break: keep-all; }
.wacts { display: flex; gap: 2px; flex-shrink: 0; }
.ibtn { width: 34px; height: 34px; border: none; background: none; font-size: 17px; cursor: pointer; border-radius: 8px; color: #D1D5DB; }
.ibtn:active { background: var(--bg); }
.favbtn.on { color: var(--warn); }
.ibtn:first-child { color: inherit; }
.empty { text-align: center; color: var(--gray); padding: 40px 0; font-size: 14px; }
.fcwrap { flex: 1; display: flex; flex-direction: column; padding-bottom: 16px; }
.fcprogw { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 10px; flex-shrink: 0; }
#fcprog { height: 100%; background: var(--primary); width: 0; transition: width .2s; }
#fccard { flex: 1; min-height: 240px; background: #fff; border-radius: 20px; box-shadow: 0 4px 18px rgba(37,99,235,.10); border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; cursor: pointer; user-select: none; }
#fcctr { position: absolute; top: 14px; left: 16px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--gray); }
.fcfav { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 24px; color: #D1D5DB; cursor: pointer; padding: 4px 8px; }
.fcfav.on { color: var(--warn); }
#fcword { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 30px; color: #111827; word-break: break-word; }
#fcmean { display: none; margin-top: 18px; font-size: 19px; color: var(--primary); font-weight: 700; word-break: keep-all; }
#fctap { margin-top: 18px; font-size: 13px; color: #9CA3AF; }
.fcnav { display: flex; gap: 8px; margin-top: 14px; flex-shrink: 0; }
.fcbtn { flex: 1; padding: 14px 0; border: none; border-radius: 14px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
.fcbtn.sec { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.fchint { text-align: center; font-size: 11px; color: #9CA3AF; margin-top: 8px; }
.tsetup { background: #fff; border-radius: 18px; padding: 20px 18px; border: 1px solid var(--border); }
.ttitle { font-size: 20px; font-weight: 800; }
.tsub { font-size: 13px; color: var(--gray); margin: 4px 0 16px; }
.tlab { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
.tinput { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; font-family: inherit; outline: none; }
.tinput:focus { border-color: var(--primary); }
.qcnt { display: flex; }
.tinfo { font-size: 12px; color: var(--gray); margin-bottom: 4px; }
.pbtn { display: block; width: 100%; padding: 15px 0; margin-top: 14px; border: none; border-radius: 14px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.pbtn:active { background: var(--primary-dark); }
.pbtn.sec { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); margin-top: 10px; }
.pbtn.kakao { background: #25D366; }
.tprog { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.tprogbar { height: 100%; background: var(--primary); transition: width .2s; }
.tmeta { display: flex; justify-content: space-between; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: var(--gray); margin: 8px 2px 10px; }
.tok { color: var(--success); }
.tqcard { background: #fff; border-radius: 18px; border: 1px solid var(--border); padding: 28px 18px 18px; text-align: center; margin-bottom: 12px; }
.tqword { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 28px; word-break: break-word; }
.tspk { margin-top: 12px; border: none; background: var(--primary-light); color: var(--primary); padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.topt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 8px; background: #fff; border: 1.5px solid var(--border); border-radius: 14px; font-size: 15px; cursor: pointer; color: #111827; }
.topt:active { background: var(--primary-light); }
.onum { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray); }
.otxt { word-break: keep-all; }
.topt.correct { background: #ECFDF5; border-color: var(--success); color: #065F46; font-weight: 700; }
.topt.correct .onum { background: var(--success); color: #fff; border-color: var(--success); }
.topt.wrong { background: #FEF2F2; border-color: var(--danger); color: #991B1B; }
.topt.wrong .onum { background: var(--danger); color: #fff; border-color: var(--danger); }
.tres { background: #fff; border-radius: 18px; border: 1px solid var(--border); padding: 24px; text-align: center; }
.temo { font-size: 52px; }
.tname { font-size: 15px; color: var(--gray); margin-top: 6px; }
.tscore { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 34px; color: var(--primary); margin-top: 4px; }
.tpct { font-family: 'Nunito','Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; color: #374151; }
.wtitle { font-weight: 800; font-size: 14px; margin: 18px 2px 8px; }
.wrow { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
.wrw { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; }
.wra { font-size: 13px; color: var(--gray); margin-top: 2px; }
.bad { color: var(--danger); font-weight: 600; }
.good { color: var(--success); font-weight: 700; }

</head>

<div class="app">
  <div class="hdr">
    <h1>씨유에탑 ✦ 영어단어장</h1>

  <div class="pane" id="pane-w">

      <button class="fbtn" data-f="fav" onclick="setFilter('fav')">⭐즐겨찾기</button>
      <span class="wcount" id="wcount"></span>
    </div>
    <div id="wlist"></div>
  </div>
  <div class="pane" id="pane-fc">
    <div class="rbar" id="fcrbar"></div>
    <div class="fcwrap">
      <div class="fcprogw"><div id="fcprog"></div></div>
      <div id="fccard">
        <div id="fcctr"></div>
        <button id="fcfavbtn" class="fcfav">☆</button>
        <div id="fcword"></div>
        <div id="fcmean"></div>
        <div id="fctap">👆 탭하여 뜻 보기</div>
      </div>
      <div class="fcnav">
        <button class="fcbtn sec" onclick="fcPrev()">◀ 이전</button>
        <button class="fcbtn" style="background:var(--warn);" onclick="speakFc()">🔊</button>
        <button class="fcbtn" onclick="fcNext()">다음 ▶</button>
      </div>
      <div class="fchint">좌우로 스와이프해도 넘어가요</div>
    </div>
  </div>
  <div class="pane" id="pane-t">
    <div id="tbox"></div>
  </div>
</div>

  {word:'practitioner', meaning:'전문의'},
  {word:'insistent', meaning:'끈질긴, 강요하는'},
  {word:'palpitations', meaning:'비정상적으로 빠른 심장 박동'},
  {word:'respire', meaning:'호흡하다'},
  {word:'compressed', meaning:'압축된, 압착된, 간결한'},
  {word:'sterilize', meaning:'살균하다'},
  {word:'milestone', meaning:'획기적인 사건, 중요한 단계'},
  {word:'deter', meaning:'단념시키다, 막다'},
  {word:'recuperate', meaning:'회복하다, 건강을 되찾다'},
  {word:'wing', meaning:'별관, 부속 건물'},
  {word:'on an empty stomach', meaning:'공복에'},
  {word:'be on medication', meaning:'약물 치료 중이다'},
  {word:'plausible', meaning:'그럴듯한'},
  {word:'prolonged', meaning:'장기의, 오래 끄는'},
  {word:'elderly', meaning:'나이 든'},
  {word:'perspire', meaning:'땀을 흘리다'},
  {word:'respiratory system', meaning:'호흡 기관'},
  {word:'recurring', meaning:'되풀이하여 반복하는'},
];

var SERIES = '토익 노랭이';
var SKEY = 'cutop_toeic_noraengi';
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function speak(t) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function speakFc() { speak(document.getElementById('fcword').textContent); }

/* ===== storage ===== */
var ST = {};
try { ST = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { ST = {}; }
function sk(w) { return w.word + '|' + w.meaning; }
function getS(w) { return ST[sk(w)] || {status:'', fav:false}; }
function setS(w, o) {
  var s = getS(w);
  var n = {status: s.status, fav: s.fav};
  for (var k in o) n[k] = o[k];
  ST[sk(w)] = n;
  try { localStorage.setItem(SKEY, JSON.stringify(ST)); } catch (e) {}
}

/* ===== ranges ===== */
function buildRanges(ws) {
  var r = [{label:'전체', s:0, e:ws.length}];
  for (var i = 0; i < ws.length; i += 50) {
    var e = Math.min(i + 50, ws.length);
    r.push({label:(i+1)+'~'+e, s:i, e:e});
  }
  return r;
}
var RANGES = buildRanges(rawWords);
function renderRangeBar(barId, ri, fn) {
  var bar = document.getElementById(barId);
  if (!bar) return;
  var h = [];
  for (var i = 0; i < RANGES.length; i++) {
    var cls = 'rbtn' + (i === ri ? ' on' : '');
    h.push('<button class="' + cls + '" data-i="' + i + '" onclick="' + fn + '(this)">' + RANGES[i].label + '</button>');
  }
  bar.innerHTML = h.join('');
  var on = bar.querySelector('.rbtn.on');
  if (on) bar.scrollLeft = on.offsetLeft - bar.offsetLeft - 40;
}
function wordsForRange(ri) {
  var r = RANGES[ri];
  return rawWords.slice(r.s, r.e);
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ===== tabs ===== */
var TABS = ['w','fc','t'];
function showTab(id) {
  for (var i = 0; i < TABS.length; i++) {
    var t = TABS[i];
    document.getElementById('pane-' + t).classList.toggle('on', t === id);
    document.getElementById('tb-' + t).classList.toggle('on', t === id);
  }
  if (id === 'w')  { renderRangeBar('wrbar', wri, 'setWR'); renderList(); }
  if (id === 'fc') { fcInit(); }
  if (id === 't')  { tSetup(); }
}

/* ===== tab1: list ===== */
var wri = 1, wFilter = 'all', wQuery = '';
function setWR(el) { wri = parseInt(el.getAttribute('data-i'), 10); renderList(); document.getElementById('wlist').scrollTop = 0; }
function setFilter(f) {
  wFilter = f;
  var bs = document.querySelectorAll('.fbtn');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-f') === f);
  renderList();
}
function onSearch(el) { wQuery = el.value.replace(/^\s+|\s+$/g, '').toLowerCase(); renderList(); }
function renderList() {
  renderRangeBar('wrbar', wri, 'setWR');
  var pool = wQuery ? rawWords : wordsForRange(wri);
  var list = [];
  for (var i = 0; i < pool.length; i++) {
    var w = pool[i], s = getS(w);
    if (wFilter === 'unk' && s.status === 'known') continue;
    if (wFilter === 'fav' && !s.fav) continue;
    if (wQuery && w.word.toLowerCase().indexOf(wQuery) < 0 && w.meaning.toLowerCase().indexOf(wQuery) < 0) continue;
    list.push(w);
  }
  var h = [];
  if (!list.length) h.push('<div class="empty">표시할 단어가 없어요</div>');
  for (var j = 0; j < list.length; j++) {
    var x = list[j], st = getS(x);
    var known = st.status === 'known', fav = st.fav;
    h.push('<div class="wcard' + (known ? ' known' : '') + '">');
    h.push('<button class="chk' + (known ? ' on' : '') + '" data-wi="' + j + '" onclick="toggleKnown(this)">' + (known ? '✔' : '') + '</button>');
    h.push('<div class="wbody">');
    h.push('<div class="wword">' + esc(x.word) + '</div>');
    h.push('<div class="wmean">' + esc(x.meaning) + '</div>');
    h.push('</div>');
    h.push('<div class="wacts">');
    h.push('<button class="ibtn" data-w="' + esc(x.word) + '" onclick="speak(this.dataset.w)">🔊</button>');
    h.push('<button class="ibtn favbtn' + (fav ? ' on' : '') + '" data-wi="' + j + '" onclick="toggleFav(this)">' + (fav ? '★' : '☆') + '</button>');
    h.push('</div>');
    h.push('</div>');
  }
  document.getElementById('wlist').innerHTML = h.join('');
  document.getElementById('wcount').textContent = list.length + '단어' + (wQuery ? ' (전체 검색)' : '');
  window._wlist = list;
}
function toggleKnown(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  setS(w, {status: getS(w).status === 'known' ? '' : 'known'});
  renderList();
}
function toggleFav(el) {
  var w = window._wlist[parseInt(el.getAttribute('data-wi'), 10)];
  setS(w, {fav: !getS(w).fav});
  renderList();
}

/* ===== tab2: flashcard ===== */
var fri = 1, fcPool = [], fcIdx = 0, fcFlipped = false, fcTX = 0;
function setFCR(el) { fri = parseInt(el.getAttribute('data-i'), 10); fcIdx = 0; fcInit(); }
var fcEvReg = false;
function fcRegisterEvents() {
  if (fcEvReg) return;
  fcEvReg = true;
  var card = document.getElementById('fccard');
  card.addEventListener('click', function(e) {
    if (e.target.id === 'fcfavbtn') return;
    fcFlip();
  });
  card.addEventListener('touchstart', function(e) {
    fcTX = e.touches[0].clientX;
  }, {passive:true});
  card.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - fcTX;
    if (Math.abs(dx) > 50) { if (dx < 0) fcNext(); else fcPrev(); }
  }, {passive:true});
  document.getElementById('fcfavbtn').addEventListener('click', function(e) {
    e.stopPropagation();
    if (!fcPool.length) return;
    var w = fcPool[fcIdx];
    setS(w, {fav: !getS(w).fav});
    fcFavPaint();
  });
}
function fcInit() {
  renderRangeBar('fcrbar', fri, 'setFCR');
  fcPool = wordsForRange(fri);
  if (fcIdx >= fcPool.length) fcIdx = 0;
  fcRegisterEvents();
  fcShow();
}
function fcFavPaint() {
  var b = document.getElementById('fcfavbtn');
  var fav = fcPool.length ? getS(fcPool[fcIdx]).fav : false;
  b.textContent = fav ? '★' : '☆';
  b.className = 'fcfav' + (fav ? ' on' : '');
}
function fcShow() {
  if (!fcPool.length) return;
  fcFlipped = false;
  var w = fcPool[fcIdx];
  document.getElementById('fcword').textContent = w.word;
  document.getElementById('fcmean').textContent = w.meaning;
  document.getElementById('fcmean').style.display = 'none';
  document.getElementById('fctap').style.display = 'block';
  document.getElementById('fcctr').textContent = (fcIdx+1) + '/' + fcPool.length;
  document.getElementById('fcprog').style.width = ((fcIdx+1) / fcPool.length * 100) + '%';
  fcFavPaint();
}
function fcFlip() {
  if (fcFlipped) return;
  if (!fcPool.length) return;
  fcFlipped = true;
  document.getElementById('fcmean').style.display = 'block';
  document.getElementById('fctap').style.display = 'none';
  speak(fcPool[fcIdx].word);
}
function fcNext() { if (!fcPool.length) return; fcIdx = (fcIdx + 1) % fcPool.length; fcShow(); }
function fcPrev() { if (!fcPool.length) return; fcIdx = (fcIdx - 1 + fcPool.length) % fcPool.length; fcShow(); }

/* ===== tab3: test ===== */
var tri = 1, tName = '', tQs = [], tIdx = 0, tCorrect = 0, tLocked = false, tResults = [], tOpts = [];
var ALL_MEANINGS = (function() {
  var seen = {}, out = [];
  for (var i = 0; i < rawWords.length; i++) {
    var m = rawWords[i].meaning;
    if (!seen[m]) { seen[m] = 1; out.push(m); }
  }
  return out;
})();
function setTR(el) { tri = parseInt(el.getAttribute('data-i'), 10); renderRangeBar('trbar', tri, 'setTR'); updTInfo(); }
function updTInfo() {
  var n = Math.min(50, wordsForRange(tri).length);
  var el = document.getElementById('tinfo');
  if (el) el.textContent = RANGES[tri].label + ' 범위에서 ' + n + '문제 랜덤 출제';
}
function tSetup() {
  var h = [];
  h.push('<div class="tsetup">');
  h.push('<div class="ttitle">📝 단어 테스트</div>');
  h.push('<div class="tsub">한글 뜻 4지선다 객관식</div>');
  h.push('<label class="tlab">이름</label>');
  h.push('<input id="tname" class="tinput" type="text" placeholder="이름을 입력하세요" autocomplete="off">');
  h.push('<label class="tlab">문제 수</label>');
  h.push('<div class="qcnt"><button class="rbtn on">50단어</button></div>');
  h.push('<label class="tlab">범위</label>');
  h.push('<div class="rbar" id="trbar"></div>');
  h.push('<div class="tinfo" id="tinfo"></div>');
  h.push('<button class="pbtn" onclick="tStart()">테스트 시작 →</button>');
  h.push('</div>');
  var box = document.getElementById('tbox');
  box.innerHTML = h.join('');
  document.getElementById('tname').value = tName;
  renderRangeBar('trbar', tri, 'setTR');
  updTInfo();
}
function tStart() {
  var nm = document.getElementById('tname').value.replace(/^\s+|\s+$/g, '');
  if (!nm) { alert('이름을 입력해 주세요.'); return; }
  tName = nm;
  var pool = shuffle(wordsForRange(tri).slice());
  tQs = pool.slice(0, Math.min(50, pool.length));
  tIdx = 0; tCorrect = 0; tResults = [];
  tShowQ();
}
function makeOpts(correct) {
  var picks = [], used = {};
  used[correct] = 1;
  var guard = 0;
  while (picks.length < 3 && guard < 500) {
    guard++;
    var m = ALL_MEANINGS[Math.floor(Math.random() * ALL_MEANINGS.length)];
    if (used[m]) continue;
    used[m] = 1;
    picks.push(m);
  }
  picks.push(correct);
  return shuffle(picks);
}
function tShowQ() {
  tLocked = false;
  var q = tQs[tIdx];
  tOpts = makeOpts(q.meaning);
  var total = tQs.length;
  var h = [];
  h.push('<div class="tprog"><div class="tprogbar" style="width:' + (tIdx / total * 100) + '%"></div></div>');
  h.push('<div class="tmeta"><span>' + (tIdx + 1) + ' / ' + total + '</span><span class="tok">✔ ' + tCorrect + '</span></div>');
  h.push('<div class="tqcard">');
  h.push('<div class="tqword">' + esc(q.word) + '</div>');
  h.push('<button class="tspk" data-w="' + esc(q.word) + '" onclick="speak(this.dataset.w)">🔊 발음 듣기</button>');
  h.push('</div>');
  h.push('<div id="toptions">');
  for (var i = 0; i < tOpts.length; i++) {
    h.push('<button class="topt" data-oi="' + i + '" onclick="tPick(this)"><span class="onum">' + (i + 1) + '</span><span class="otxt">' + esc(tOpts[i]) + '</span></button>');
  }
  h.push('</div>');
  h.push('<button id="t-next-btn" class="pbtn" style="display:none" onclick="tNext()">' + (tIdx === total - 1 ? '결과 보기 →' : '다음 →') + '</button>');
  document.getElementById('tbox').innerHTML = h.join('');
  speak(q.word);
}
function tPick(el) {
  var oi = parseInt(el.getAttribute('data-oi'), 10);
  tAnswer(el, tOpts[oi], tQs[tIdx].meaning);
}
function tAnswer(el, chosen, correct) {
  if (tLocked) return;
  tLocked = true;
  var opts = document.querySelectorAll('#toptions .topt');
  for (var i = 0; i < opts.length; i++) {
    var b = opts[i];
    var txt = tOpts[parseInt(b.getAttribute('data-oi'), 10)];
    if (txt === correct) b.className += ' correct';
    else if (b === el) b.className += ' wrong';
    b.style.pointerEvents = 'none';
  }
  var ok = (chosen === correct);
  if (ok) tCorrect++;
  tResults.push({word: tQs[tIdx].word, meaning: correct, ans: chosen, ok: ok});
  var meta = document.querySelector('.tok');
  if (meta) meta.textContent = '✔ ' + tCorrect;
  document.getElementById('t-next-btn').style.display = 'block';
}
function tNext() {
  tIdx++;
  if (tIdx >= tQs.length) tShowResult();
  else tShowQ();
}
function tShowResult() {
  var total = tQs.length;
  var pct = Math.round(tCorrect / total * 100);
  var emo = pct === 100 ? '🏆' : pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '💪';
  var wrong = [];
  for (var i = 0; i < tResults.length; i++) if (!tResults[i].ok) wrong.push(tResults[i]);
  var h = [];
  h.push('<div class="tres">');
  h.push('<div class="temo">' + emo + '</div>');
  h.push('<div class="tname">' + esc(tName) + '</div>');
  h.push('<div class="tscore">' + tCorrect + ' / ' + total + '</div>');
  h.push('<div class="tpct">' + pct + '점</div>');
  h.push('</div>');
  if (wrong.length) {
    h.push('<div class="wtitle">❌ 틀린 단어 (' + wrong.length + '개)</div>');
    for (var j = 0; j < wrong.length; j++) {
      var r = wrong[j];
      h.push('<div class="wrow">');
      h.push('<div class="wrw">' + esc(r.word) + '</div>');
      h.push('<div class="wra">입력: <span class="bad">' + esc(r.ans) + '</span></div>');
      h.push('<div class="wra">정답: <span class="good">' + esc(r.meaning) + '</span></div>');
      h.push('</div>');
    }
  }
  h.push('<button class="pbtn kakao" onclick="tCopy()">📋 카톡으로 결과 복사</button>');
  h.push('<button class="pbtn sec" onclick="tSetup()">↩ 다시 테스트</button>');
  document.getElementById('tbox').innerHTML = h.join('');
  document.getElementById('pane-t').scrollTop = 0;
}
function tCopyText() {
  var d = new Date();
  var total = tQs.length;
  var pct = Math.round(tCorrect / total * 100);
  var L = [];
  L.push('[씨유에탑 ' + SERIES + '] 테스트 결과');
  L.push('날짜: ' + d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.');
  L.push('이름: ' + tName);
  L.push('점수: ' + tCorrect + '/' + total + ' (' + pct + '점)');
  L.push('─────────────────');
  var wrong = [], right = [];
  for (var i = 0; i < tResults.length; i++) {
    if (tResults[i].ok) right.push(tResults[i].word); else wrong.push(tResults[i]);
  }
  L.push('❌ 틀린 단어 (' + wrong.length + '개)');
  for (var j = 0; j < wrong.length; j++) {
    L.push('  ' + wrong[j].word + ' → 입력:' + wrong[j].ans + ' / 정답:' + wrong[j].meaning);
  }
  L.push('─────────────────');
  L.push('✅ 맞은 단어: ' + right.join(', '));
  return L.join('\n');
}
function tCopy() {
  var txt = tCopyText();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); alert('결과가 복사되었습니다! 카톡에 붙여넣기 하세요.'); }
    catch (e) { alert('복사에 실패했습니다.'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function() {
      alert('결과가 복사되었습니다! 카톡에 붙여넣기 하세요.');
    }, fallback);
  } else fallback();
}

window.onload = function() { showTab('w'); };

</script>
